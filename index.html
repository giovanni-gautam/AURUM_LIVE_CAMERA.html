<!-- AURUM LIVE GPS CAMERA FINAL FIXED - 2026-09-18 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aurum • Live GPS Camera</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f3f8fc;
  font-family:Arial,sans-serif;
  color:#102b50;
  display:flex;
  justify-content:center;
  min-height:100vh;
}

.wrap{
  width:min(560px,100%);
  padding:18px;
}

.card{
  background:#fff;
  border:1px solid #dbe4ef;
  border-radius:22px;
  padding:18px;
  box-shadow:0 16px 40px rgba(10,45,80,.12);
}

h1{
  font-size:24px;
  text-align:center;
  margin:4px 0;
}

.sub{
  text-align:center;
  color:#70809a;
  font-size:13px;
  margin:0 0 15px;
}

.info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:12px;
}

.info div{
  background:#f5f8fc;
  border:1px solid #dbe4ef;
  border-radius:12px;
  padding:9px;
}

.info small{
  display:block;
  color:#70809a;
  font-size:9px;
  font-weight:800;
  margin-bottom:4px;
}

.info strong{
  font-size:12px;
  line-height:1.25;
}

.camera{
  position:relative;
  background:#061d30;
  border-radius:18px;
  overflow:hidden;
  aspect-ratio:4/3;
}

video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transform:scaleX(-1);
}

.badge{
  position:absolute;
  left:12px;
  top:12px;
  background:#06111c;
  color:#fff;
  border-radius:18px;
  padding:7px 10px;
  font-size:10px;
  font-weight:800;
}

.dot{
  display:inline-block;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#ef3b35;
  margin-right:5px;
}

.status{
  text-align:center;
  font-size:12px;
  margin:12px 0;
  color:#08714f;
  font-weight:700;
  min-height:16px;
}

.actions{
  display:flex;
  gap:9px;
}

button{
  border:0;
  border-radius:12px;
  padding:13px 10px;
  font-weight:800;
  cursor:pointer;
  flex:1;
  font-size:13px;
}

.capture{
  background:#08714f;
  color:#fff;
}

.capture:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.retake{
  background:#e9f0f7;
  color:#102b50;
  display:none;
}

.close{
  background:#fff;
  border:1px solid #dbe4ef;
  color:#102b50;
  margin-top:9px;
  width:100%;
}

.msg{
  text-align:center;
  color:#b3261e;
  font-size:12px;
  font-weight:700;
  min-height:18px;
  margin-top:8px;
  line-height:1.4;
}

canvas{
  display:none;
}

@media(max-width:430px){
  .info{
    grid-template-columns:1fr;
  }

  .wrap{
    padding:10px;
  }

  .card{
    padding:13px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="card">

    <h1>LIVE GPS SELFIE</h1>

    <p class="sub">
      Aurum • Live camera capture
    </p>


    <div class="info">

      <div>
        <small>TM NAME</small>
        <strong id="tm">-</strong>
      </div>

      <div>
        <small>HQ</small>
        <strong id="hq">-</strong>
      </div>

      <div>
        <small>AREA / LOCATION</small>
        <strong id="area">-</strong>
      </div>

      <div>
        <small>EXACT LOCATION</small>
        <strong id="exact">-</strong>
      </div>

    </div>


    <div class="camera">

      <video
        id="video"
        autoplay
        playsinline
        muted>
      </video>

      <div class="badge">
        <span class="dot"></span>
        LIVE CAMERA
      </div>

    </div>


    <div id="status" class="status">
      Starting camera...
    </div>


    <div class="actions">

      <button
        id="capture"
        class="capture"
        onclick="capture()"
        disabled>
        📷 CAPTURE LIVE SELFIE
      </button>

      <button
        id="retake"
        class="retake"
        onclick="startCamera()">
        RETAKE
      </button>

    </div>


    <button
      class="close"
      onclick="goBack()">
      CLOSE CAMERA
    </button>


    <div
      id="msg"
      class="msg">
    </div>


    <canvas id="canvas"></canvas>

  </div>

</div>


<script>
const params = new URLSearchParams(location.search);

const tm = params.get('tm') || '-';
const hq = params.get('hq') || '-';
const tmCode = params.get('tmCode') || '';
const returnUrl = params.get('returnUrl') || '';

let latitude = null;
let longitude = null;
let gpsAccuracy = null;
let areaLocation = '';
let exactLocation = '';

let stream = null;
let busy = false;
let locationReady = false;
let exactLocationReady = false;
let bestAccuracy = Infinity;
let watchId = null;
let stopWatchTimer = null;
let addressTimer = null;
let addressRequestRunning = false;
let addressRequestSerial = 0;
let submitFrame = null;

function el(id){
  return document.getElementById(id);
}

function isBadLocation(value){
  const v = String(value || '').trim();
  return !v || [
    'Location captured',
    'Location not available',
    'Finding exact location...',
    'Finding area...',
    'Address unavailable'
  ].indexOf(v) >= 0;
}

function updateCaptureAvailability(){
  const btn = el('capture');
  btn.disabled = !(
    stream &&
    locationReady &&
    exactLocationReady &&
    latitude !== null &&
    longitude !== null &&
    !isBadLocation(exactLocation)
  );
}

function stopCamera(){
  if(stream){
    stream.getTracks().forEach(function(track){
      try{ track.stop(); }catch(e){}
    });
    stream = null;
  }
}

function stopGPSWatch(){
  if(watchId !== null){
    try{ navigator.geolocation.clearWatch(watchId); }catch(e){}
    watchId = null;
  }
  if(stopWatchTimer){
    clearTimeout(stopWatchTimer);
    stopWatchTimer = null;
  }
}

function requestExactAddress(lat, lon){

  if(!returnUrl || !Number.isFinite(lat) || !Number.isFinite(lon)) return;

  addressRequestRunning = true;
  const serial = ++addressRequestSerial;
  const callbackName = '__aurumGPS_' + Date.now() + '_' + Math.random().toString(36).slice(2);
  let script = null;
  let finished = false;

  const badValues = [
    'Location captured',
    'Location not available',
    'Finding exact location...',
    'Finding area...',
    'Address unavailable'
  ];

  function cleanup(){
    if(script && script.parentNode){
      try{ script.parentNode.removeChild(script); }catch(e){}
    }
    try{ delete window[callbackName]; }catch(e){}
  }

  function finish(data){
    if(finished) return;
    finished = true;
    addressRequestRunning = false;
    cleanup();

    /* Ignore stale responses from an older GPS position. */
    if(serial !== addressRequestSerial) return;

    data = data || {};

    const exact = String(data.exactLocation || '').trim();
    const area = String(data.areaLocation || '').trim();

    if(exact && badValues.indexOf(exact) === -1){
      exactLocation = exact;
      areaLocation = area || exact;
      exactLocationReady = true;

      el('area').textContent = areaLocation;
      el('exact').textContent = exactLocation;

      el('status').textContent =
        '✓ Camera + exact location ready' +
        (gpsAccuracy !== null ? ' • ±' + Math.round(gpsAccuracy) + ' m' : '') +
        ' — capture when ready';
      el('status').style.color = '#08714f';
      el('msg').textContent = '';

    }else{
      exactLocation = '';
      exactLocationReady = false;
      el('exact').textContent = 'Waiting for exact address...';
      el('status').textContent =
        'GPS received • exact address unavailable yet';
      el('status').style.color = '#b3261e';
      el('msg').textContent =
        'Live GPS is available, but the exact address has not been returned yet. Please wait a moment.';
      el('msg').style.color = '#b3261e';
    }

    updateCaptureAvailability();
  }

  window[callbackName] = finish;

  try{
    const apiUrl = new URL(returnUrl);
    apiUrl.search = '';
    apiUrl.hash = '';
    apiUrl.searchParams.set('api','getGPSLocationDetails');
    apiUrl.searchParams.set('arg0',String(lat));
    apiUrl.searchParams.set('arg1',String(lon));
    apiUrl.searchParams.set('callback',callbackName);
    apiUrl.searchParams.set('_',String(Date.now()));

    script = document.createElement('script');
    script.async = true;
    script.src = apiUrl.toString();
    script.onerror = function(){ finish({}); };
    document.head.appendChild(script);

  }catch(error){
    finish({});
    return;
  }

  setTimeout(function(){
    if(!finished) finish({});
  }, 15000);
}

function applyGPSPosition(position){

  const lat = Number(position.coords.latitude);
  const lon = Number(position.coords.longitude);
  const accuracy = Number(position.coords.accuracy);

  if(!Number.isFinite(lat) || !Number.isFinite(lon)) return;

  const usableAccuracy = Number.isFinite(accuracy) ? accuracy : 999999;

  /* Only accept a new reading when it is the first fix or more accurate. */
  if(latitude !== null && usableAccuracy >= bestAccuracy) return;

  latitude = lat;
  longitude = lon;
  gpsAccuracy = Number.isFinite(accuracy) ? accuracy : null;
  bestAccuracy = usableAccuracy;
  locationReady = true;
  exactLocationReady = false;
  exactLocation = '';

  el('area').textContent = 'Resolving exact address...';
  el('exact').textContent = 'Waiting for exact address...';
  el('status').textContent =
    '✓ Precise GPS received • ±' +
    Math.round(usableAccuracy) +
    ' m • resolving address...';
  el('status').style.color = '#08714f';
  el('msg').textContent = 'Please wait while the exact location is verified.';
  el('msg').style.color = '#08714f';

  requestExactAddress(lat,lon);
  updateCaptureAvailability();
}

function startPreciseGPS(){

  if(!navigator.geolocation){
    el('status').textContent = 'Location permission required';
    el('status').style.color = '#b3261e';
    el('msg').textContent = 'This browser does not support GPS location.';
    el('msg').style.color = '#b3261e';
    updateCaptureAvailability();
    return;
  }

  el('status').textContent = 'Requesting precise GPS location...';
  el('status').style.color = '#08714f';
  el('msg').textContent = 'Please tap Allow for Location.';
  el('msg').style.color = '#08714f';

  const options = {
    enableHighAccuracy: true,
    timeout: 10000,
    maximumAge: 0
  };

  /* One immediate fix keeps the GPS flow responsive. */
  navigator.geolocation.getCurrentPosition(
    applyGPSPosition,
    function(error){
      if(error && error.code === 1){
        el('status').textContent = 'Location permission required';
        el('msg').textContent =
          'Location access was denied. Chrome Site Settings → Location → Allow for this site, then refresh.';
      }else{
        el('status').textContent = 'Waiting for GPS fix...';
        el('msg').textContent =
          'Please keep Location enabled and wait for a GPS fix.';
      }
      el('status').style.color = '#b3261e';
      el('msg').style.color = '#b3261e';
      updateCaptureAvailability();
    },
    options
  );

  /* Watch for a better/ more precise reading while camera is already live. */
  try{
    watchId = navigator.geolocation.watchPosition(
      function(position){
        applyGPSPosition(position);
        if(
          gpsAccuracy !== null &&
          gpsAccuracy <= 20
        ){
          stopGPSWatch();
        }
      },
      function(){ /* keep the first successful reading */ },
      options
    );

    stopWatchTimer = setTimeout(function(){
      stopGPSWatch();
    }, 7000);

  }catch(error){}
}

async function startCamera(){

  const captureBtn = el('capture');
  const retakeBtn = el('retake');

  captureBtn.disabled = true;
  retakeBtn.style.display = 'none';
  stopCamera();

  try{
    if(!window.isSecureContext){
      throw new Error('Camera requires a secure HTTPS page.');
    }

    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      throw new Error('Camera API is not available in this browser.');
    }

    el('status').textContent =
      locationReady
        ? 'GPS active • requesting camera...'
        : 'Requesting camera permission...';
    el('status').style.color = '#08714f';

    stream = await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:{ideal:'user'},
        width:{ideal:1280},
        height:{ideal:960}
      },
      audio:false
    });

    const video = el('video');
    video.srcObject = stream;
    await video.play();

    el('status').textContent = exactLocationReady
      ? '✓ Camera + exact location ready — capture when ready'
      : '✓ Camera ready • waiting for exact GPS address...';
    el('status').style.color = '#08714f';

    el('msg').textContent = exactLocationReady
      ? ''
      : 'GPS is being verified. Capture will enable automatically after the exact address is confirmed.';
    el('msg').style.color = '#70809a';

    updateCaptureAvailability();

  }catch(error){
    el('status').textContent = 'Camera permission required';
    el('status').style.color = '#b3261e';

    if(error && error.name === 'NotAllowedError'){
      el('msg').textContent =
        'Camera access was denied. Chrome Site Settings → Camera → Allow for giovanni-gautam.github.io, then refresh.';
    }else if(error && error.name === 'NotFoundError'){
      el('msg').textContent = 'No camera was found on this device.';
    }else if(error && error.name === 'NotReadableError'){
      el('msg').textContent = 'Camera is already being used by another application.';
    }else{
      el('msg').textContent =
        (error && error.message) || 'Please allow camera access.';
    }

    el('msg').style.color = '#b3261e';
    updateCaptureAvailability();
  }
}

function drawWrappedText(ctx, text, x, y, maxWidth, lineHeight){
  let line = '';
  const words = String(text || '').split(/\s+/);
  for(let i=0;i<words.length;i++){
    const test = line ? line + ' ' + words[i] : words[i];
    if(ctx.measureText(test).width > maxWidth && line){
      ctx.fillText(line,x,y);
      y += lineHeight;
      line = words[i];
    }else{
      line = test;
    }
  }
  if(line) ctx.fillText(line,x,y);
  return y;
}

function capture(){

  if(
    busy ||
    !stream ||
    !locationReady ||
    !exactLocationReady ||
    isBadLocation(exactLocation) ||
    latitude === null ||
    longitude === null
  ){
    el('msg').textContent =
      'Please wait until camera, precise GPS and exact address are all ready.';
    el('msg').style.color = '#b3261e';
    return;
  }

  busy = true;
  const video = el('video');
  const canvas = el('canvas');
  const ctx = canvas.getContext('2d');

  if(!video.videoWidth){
    busy = false;
    return;
  }

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  /* Mirror the selfie exactly as seen on screen. */
  ctx.save();
  ctx.translate(canvas.width,0);
  ctx.scale(-1,1);
  ctx.drawImage(video,0,0,canvas.width,canvas.height);
  ctx.restore();

  /* Premium bottom stamp with real GPS + exact location. */
  const pad = Math.max(24, canvas.width * 0.03);
  const stampHeight = Math.max(190, canvas.height * 0.29);
  const stampY = canvas.height - stampHeight;

  ctx.fillStyle = 'rgba(4,25,43,.84)';
  ctx.fillRect(0,stampY,canvas.width,stampHeight);

  ctx.fillStyle = '#ffffff';
  ctx.font = '800 ' + Math.max(22,canvas.width*0.030) + 'px Arial';
  ctx.fillText('AURUM • LIVE GPS VERIFIED',pad,stampY+38);

  ctx.font = '700 ' + Math.max(18,canvas.width*0.024) + 'px Arial';
  ctx.fillText(tm,pad,stampY+72);

  ctx.font = '600 ' + Math.max(14,canvas.width*0.018) + 'px Arial';
  ctx.fillText(hq,pad,stampY+98);

  ctx.font = '700 ' + Math.max(15,canvas.width*0.020) + 'px Arial';
  let y = stampY + 128;
  y = drawWrappedText(
    ctx,
    '📍 EXACT LOCATION: ' + exactLocation,
    pad,
    y,
    canvas.width - pad*2,
    Math.max(20,canvas.width*0.026)
  );

  ctx.font = '600 ' + Math.max(13,canvas.width*0.017) + 'px Arial';
  const gpsLine =
    'GPS: ' +
    Number(latitude).toFixed(6) +
    ', ' +
    Number(longitude).toFixed(6) +
    ' • Accuracy ±' +
    (gpsAccuracy !== null ? Math.round(gpsAccuracy) : '?') +
    ' m';
  ctx.fillText(gpsLine,pad,Math.min(stampY+stampHeight-20,y+26));

  const image = canvas.toDataURL('image/jpeg',0.90);
  el('capture').disabled = true;

  submitCapture(image);
}

function submitCapture(image){

  if(
    !returnUrl ||
    !tmCode ||
    latitude === null ||
    longitude === null ||
    !exactLocationReady ||
    isBadLocation(exactLocation)
  ){
    el('status').textContent = 'Submission data missing';
    el('status').style.color = '#b3261e';
    el('msg').textContent =
      'Precise GPS and exact address are required before submission.';
    el('msg').style.color = '#b3261e';
    busy = false;
    updateCaptureAvailability();
    return;
  }

  el('status').textContent = '✓ Selfie captured • Saving to Aurum Sync...';
  el('status').style.color = '#08714f';
  el('msg').textContent = 'Please wait...';
  el('msg').style.color = '#08714f';

  stopCamera();
  stopGPSWatch();

  /* Hidden iframe POST keeps this camera page alive. */
  if(submitFrame && submitFrame.parentNode){
    try{ submitFrame.parentNode.removeChild(submitFrame); }catch(e){}
  }

  const frameName = 'aurumSubmitFrame_' + Date.now();
  submitFrame = document.createElement('iframe');
  submitFrame.name = frameName;
  submitFrame.style.display = 'none';
  document.body.appendChild(submitFrame);

  const form = document.createElement('form');
  form.method = 'POST';
  form.action = returnUrl;
  form.target = frameName;
  form.style.display = 'none';

  function addField(name,value){
    const input = document.createElement('input');
    input.type = 'hidden';
    input.name = name;
    input.value = value == null ? '' : String(value);
    form.appendChild(input);
  }

  addField('tmCode',tmCode);
  addField('latitude',latitude);
  addField('longitude',longitude);
  addField('image',image);
  addField('area',areaLocation);
  addField('exactLocation',exactLocation);
  addField('returnUrl',returnUrl);

  document.body.appendChild(form);
  form.submit();

  /* If the server takes longer, keep the user informed. */
  setTimeout(function(){
    if(busy){
      el('msg').textContent = 'Saving selfie securely...';
    }
  },1500);
}

/* Server response arrives in the hidden iframe. */
window.addEventListener('message',function(event){
  const data = event.data || {};

  if(data.type !== 'AURUM_SERVER_SAVE_OK' || data.success !== true){
    return;
  }

  busy = false;

  el('status').textContent = '✓ Selfie saved successfully';
  el('status').style.color = '#08714f';
  el('msg').textContent =
    data.message || 'LIVE GPS SELFIE submitted successfully.';
  el('msg').style.color = '#08714f';

  /* Send the confirmed server result to the original Aurum Sync window. */
  try{
    if(window.opener && !window.opener.closed){
      window.opener.postMessage({
        type:'AURUM_GPS_SELFIE_SAVED',
        success:true,
        message:data.message || 'LIVE GPS SELFIE submitted successfully.',
        exactLocation:data.exactLocation || exactLocation,
        area:data.area || areaLocation
      }, '*');
    }
  }catch(e){}

  setTimeout(function(){
    try{ window.close(); }catch(e){}
  },700);
});

/* Retake without reloading the page. */
el('retake').addEventListener('click',function(){
  busy = false;
  exactLocationReady = !isBadLocation(exactLocation);
  startCamera();
  startPreciseGPS();
});

function goBack(){
  stopCamera();
  stopGPSWatch();
  if(returnUrl){
    window.close();
    setTimeout(function(){
      try{ window.location.href = returnUrl; }catch(e){}
    },200);
  }else{
    window.history.back();
  }
}

window.addEventListener('load',function(){
  el('tm').textContent = tm;
  el('hq').textContent = hq;
  el('area').textContent = 'Acquiring precise GPS...';
  el('exact').textContent = 'Waiting for exact location...';
  el('status').textContent = 'Starting camera + precise GPS...';
  el('status').style.color = '#08714f';

  /* IMPORTANT: camera + GPS start in parallel, so the window is immediate. */
  startCamera();
  startPreciseGPS();
});

window.addEventListener('beforeunload',function(){
  stopCamera();
  stopGPSWatch();
});
</script>

</body>
</html>
