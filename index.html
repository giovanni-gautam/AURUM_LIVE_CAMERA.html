<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aurum • Live GPS Camera</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f3f8fc;
  font-family:Arial,sans-serif;
  color:#102b50;
  display:flex;
  justify-content:center;
  min-height:100vh;
}

.wrap{
  width:min(560px,100%);
  padding:18px;
}

.card{
  background:#fff;
  border:1px solid #dbe4ef;
  border-radius:22px;
  padding:18px;
  box-shadow:0 16px 40px rgba(10,45,80,.12);
}

h1{
  font-size:24px;
  text-align:center;
  margin:4px 0;
}

.sub{
  text-align:center;
  color:#70809a;
  font-size:13px;
  margin:0 0 15px;
}

.info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:12px;
}

.info div{
  background:#f5f8fc;
  border:1px solid #dbe4ef;
  border-radius:12px;
  padding:9px;
}

.info small{
  display:block;
  color:#70809a;
  font-size:9px;
  font-weight:800;
  margin-bottom:4px;
}

.info strong{
  font-size:12px;
  line-height:1.25;
}

.camera{
  position:relative;
  background:#061d30;
  border-radius:18px;
  overflow:hidden;
  aspect-ratio:4/3;
}

video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transform:scaleX(-1);
}

.badge{
  position:absolute;
  left:12px;
  top:12px;
  background:#06111c;
  color:#fff;
  border-radius:18px;
  padding:7px 10px;
  font-size:10px;
  font-weight:800;
}

.dot{
  display:inline-block;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#ef3b35;
  margin-right:5px;
}

.status{
  text-align:center;
  font-size:12px;
  margin:12px 0;
  color:#08714f;
  font-weight:700;
  min-height:16px;
}

.actions{
  display:flex;
  gap:9px;
}

button{
  border:0;
  border-radius:12px;
  padding:13px 10px;
  font-weight:800;
  cursor:pointer;
  flex:1;
  font-size:13px;
}

.capture{
  background:#08714f;
  color:#fff;
}

.capture:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.retake{
  background:#e9f0f7;
  color:#102b50;
  display:none;
}

.close{
  background:#fff;
  border:1px solid #dbe4ef;
  color:#102b50;
  margin-top:9px;
  width:100%;
}

.msg{
  text-align:center;
  color:#b3261e;
  font-size:12px;
  font-weight:700;
  min-height:18px;
  margin-top:8px;
  line-height:1.4;
}

canvas{
  display:none;
}

@media(max-width:430px){
  .info{
    grid-template-columns:1fr;
  }

  .wrap{
    padding:10px;
  }

  .card{
    padding:13px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="card">

    <h1>LIVE GPS SELFIE</h1>

    <p class="sub">
      Aurum • Live camera capture
    </p>


    <div class="info">

      <div>
        <small>TM NAME</small>
        <strong id="tm">-</strong>
      </div>

      <div>
        <small>HQ</small>
        <strong id="hq">-</strong>
      </div>

      <div style="grid-column:1/-1">
        <small>EXACT LOCATION</small>
        <strong id="area">-</strong>
      </div>

    </div>


    <div class="camera">

      <video
        id="video"
        autoplay
        playsinline
        muted>
      </video>

      <div class="badge">
        <span class="dot"></span>
        LIVE CAMERA
      </div>

    </div>


    <div id="status" class="status">
      Starting camera...
    </div>


    <div class="actions">

      <button
        id="capture"
        class="capture"
        onclick="capture()"
        disabled>
        📷 CAPTURE LIVE SELFIE
      </button>

      <button
        id="retake"
        class="retake"
        onclick="startCamera()">
        RETAKE
      </button>

    </div>


    <button
      class="close"
      onclick="goBack()">
      CLOSE CAMERA
    </button>


    <div
      id="msg"
      class="msg">
    </div>


    <canvas id="canvas"></canvas>

  </div>

</div>


<script>

/* =====================================================
   READ URL PARAMETERS
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


const tm =
  params.get("tm") || "-";


const hq =
  params.get("hq") || "-";


const area =
  params.get("area") || "-";


const exact =
  params.get("exact") ||
  area ||
  "-";


const latitude =
  params.get("lat") || "";


const longitude =
  params.get("lon") || "";


const tmCode =
  params.get("tmCode") || "";


const returnUrl =
  params.get("returnUrl") || "";


/* =====================================================
   DISPLAY DETAILS
===================================================== */

document.getElementById("tm")
  .textContent = tm;


document.getElementById("hq")
  .textContent = hq;


document.getElementById("area")
  .textContent = exact;


/* =====================================================
   CAMERA VARIABLES
===================================================== */

let stream = null;

let busy = false;


/* =====================================================
   STOP CAMERA
===================================================== */

function stopCamera(){

  if(stream){

    stream
      .getTracks()
      .forEach(
        function(track){
          track.stop();
        }
      );

    stream = null;
  }

}


/* =====================================================
   START CAMERA
===================================================== */

async function startCamera(){

  const status =
    document.getElementById("status");

  const msg =
    document.getElementById("msg");

  const captureBtn =
    document.getElementById("capture");

  const retakeBtn =
    document.getElementById("retake");


  msg.textContent = "";

  msg.style.color = "#b3261e";

  captureBtn.disabled = true;

  retakeBtn.style.display = "none";


  stopCamera();


  try{

    /* -----------------------------------------------
       SECURE CONNECTION CHECK
    ----------------------------------------------- */

    if(
      !window.isSecureContext
    ){

      throw new Error(
        "This camera requires HTTPS."
      );

    }


    /* -----------------------------------------------
       CAMERA API CHECK
    ----------------------------------------------- */

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        "Camera API is not available in this browser."
      );

    }


    status.textContent =
      "Requesting camera permission...";


    /* -----------------------------------------------
       CAMERA PERMISSION STATE
    ----------------------------------------------- */

    try{

      if(
        navigator.permissions &&
        navigator.permissions.query
      ){

        const permission =
          await navigator.permissions.query({
            name:"camera"
          });


        if(
          permission.state === "denied"
        ){

          throw new Error(
            "Camera permission is BLOCKED for this site. Open Chrome Site Settings → Camera → Allow."
          );

        }

      }

    }catch(permissionError){

      /*
       * Ignore unsupported Permissions API.
       * Actual getUserMedia call below remains
       * the final authority.
       */

      if(
        permissionError.message &&
        permissionError.message.indexOf(
          "BLOCKED"
        ) !== -1
      ){

        throw permissionError;

      }

    }


    /* -----------------------------------------------
       REQUEST CAMERA
    ----------------------------------------------- */

    stream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:"user",
          width:{
            ideal:1280
          },
          height:{
            ideal:960
          }
        },

        audio:false

      });


    /* -----------------------------------------------
       CONNECT STREAM TO VIDEO
    ----------------------------------------------- */

    const video =
      document.getElementById("video");


    video.srcObject =
      stream;


    await video.play();


    /* -----------------------------------------------
       CAMERA READY
    ----------------------------------------------- */

    status.textContent =
      "✓ Camera ready — capture when ready";


    status.style.color =
      "#08714f";


    captureBtn.disabled =
      false;


  }catch(e){

    console.error(
      "Camera Error:",
      e
    );


    status.textContent =
      "Camera permission required";


    status.style.color =
      "#b3261e";


    let errorMessage =
      "";


    /* -----------------------------------------------
       EXACT ERROR
    ----------------------------------------------- */

    if(
      e.name === "NotAllowedError"
    ){

      errorMessage =
        "Camera access was denied. Chrome Site Settings → Camera → Allow for giovanni-gautam.github.io, then refresh.";

    }

    else if(
      e.name === "NotFoundError"
    ){

      errorMessage =
        "No camera was found on this device.";

    }

    else if(
      e.name === "NotReadableError"
    ){

      errorMessage =
        "Camera is already being used by another application.";

    }

    else if(
      e.name === "SecurityError"
    ){

      errorMessage =
        "Browser security blocked camera access.";

    }

    else{

      errorMessage =
        e.message ||
        "Please allow camera access.";

    }


    msg.textContent =
      errorMessage;


    captureBtn.disabled =
      true;

  }

}


/* =====================================================
   CLOSE CAMERA
===================================================== */

function goBack(){

  stopCamera();


  if(returnUrl){

    window.location.href =
      returnUrl;

  }else{

    window.history.back();

  }

}


/* =====================================================
   SUBMIT CAPTURE
===================================================== */

async function submitCapture(image){

  const status =
    document.getElementById("status");

  const msg =
    document.getElementById("msg");

  if(!image){
    status.textContent = "Capture failed";
    msg.textContent = "No selfie image was created. Please try again.";
    msg.style.color = "#b3261e";
    busy = false;
    return;
  }

  /*
     IMPORTANT:
     This page is hosted on GitHub Pages, while Aurum Sync is
     hosted on Google Apps Script. Do NOT use fetch() here.

     The captured image is sent back to the parent Aurum Sync
     window using postMessage(). The parent page then calls
     google.script.run.saveLiveGPSSelfie(), which safely saves
     the selfie to Google Drive and the GPS record to Sheets.
  */

  if(!window.opener || window.opener.closed){

    status.textContent = "Selfie captured";
    msg.textContent =
      "Aurum Sync window is not available. Please reopen LIVE GPS SELFIE from Aurum Sync.";

    msg.style.color = "#b3261e";
    busy = false;
    return;
  }

  status.textContent = "✓ Selfie captured";
  status.style.color = "#08714f";

  msg.textContent = "Sending selfie back to Aurum Sync...";
  msg.style.color = "#08714f";

  try{

    window.opener.postMessage(
      {
        type: "AURUM_GPS_SELFIE_CAPTURE",
        image: image
      },
      "*"
    );

    /*
       Give the parent window a moment to receive the image,
       then close this camera window. The parent page will
       show the captured selfie and handle the final submission.
    */
    setTimeout(function(){

      stopCamera();

      try{
        window.close();
      }catch(e){}

      /*
         If the browser refuses to close the window, leave a
         clear message instead of showing a false submission error.
      */
      setTimeout(function(){

        if(!window.closed){
          msg.textContent =
            "✓ Selfie sent to Aurum Sync. You can close this camera window.";
        }

      },300);

    },700);

  }catch(e){

    console.error(
      "postMessage error:",
      e
    );

    status.textContent = "Submission failed";

    msg.textContent =
      "Could not return the selfie to Aurum Sync. Please reopen LIVE GPS SELFIE.";

    msg.style.color = "#b3261e";

    busy = false;

  }

}


/* =====================================================
   CAPTURE SELFIE
===================================================== */

function capture(){

  if(
    busy ||
    !stream
  ){

    return;

  }


  busy = true;


  const video =
    document.getElementById(
      "video"
    );


  const canvas =
    document.getElementById(
      "canvas"
    );


  const ctx =
    canvas.getContext(
      "2d"
    );


  if(
    !video.videoWidth
  ){

    busy = false;

    return;

  }


  canvas.width =
    video.videoWidth;


  canvas.height =
    video.videoHeight;


  /* -----------------------------------------------
     MIRROR CORRECTION
  ----------------------------------------------- */

  ctx.save();


  ctx.translate(
    canvas.width,
    0
  );


  ctx.scale(
    -1,
    1
  );


  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.restore();


 /* -----------------------------------------------
   COMPACT VERIFICATION STAMP
------------------------------------------------ */

const pad = Math.max(
  18,
  Math.round(canvas.width * 0.025)
);

/* Compact stamp height */
const stampHeight = Math.max(
  210,
  Math.round(canvas.height * 0.23)
);

const stampY = canvas.height - stampHeight;

ctx.save();

ctx.fillStyle = "rgba(0,0,0,0.78)";

ctx.fillRect(
  0,
  stampY,
  canvas.width,
  stampHeight
);

/* -----------------------------
   FONT SIZES
----------------------------- */

const titleSize = Math.max(
  24,
  Math.round(canvas.width * 0.033)
);

const textSize = Math.max(
  17,
  Math.round(canvas.width * 0.022)
);

const locationSize = Math.max(
  15,
  Math.round(canvas.width * 0.019)
);


/* -----------------------------
   TITLE
----------------------------- */

ctx.fillStyle = "#ffffff";

ctx.font =
  "700 " +
  titleSize +
  "px Arial";

let y = stampY + 35;

ctx.fillText(
  "AURUM • LIVE GPS VERIFIED",
  pad,
  y
);


/* -----------------------------
   TM NAME
----------------------------- */

y += 30;

ctx.font =
  "600 " +
  textSize +
  "px Arial";

ctx.fillText(
  "TM: " + tm,
  pad,
  y
);


/* -----------------------------
   DATE & TIME
----------------------------- */

const dt =
  new Date().toLocaleString(
    "en-IN",
    {
      day:"2-digit",
      month:"short",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit"
    }
  );

y += 27;

ctx.fillText(
  dt,
  pad,
  y
);


/* -----------------------------
   LOCATION
----------------------------- */

y += 29;

ctx.font =
  "600 " +
  locationSize +
  "px Arial";

const maxWidth =
  canvas.width - (pad * 2);

const locationText =
  exact ||
  area ||
  "Location captured";

const words =
  locationText.split(/\s+/);

let line = "LOCATION: ";

const lineHeight = 21;

for(const word of words){

  const test =
    line + word + " ";

  if(
    ctx.measureText(test).width > maxWidth &&
    line !== "LOCATION: "
  ){

    ctx.fillText(
      line.trim(),
      pad,
      y
    );

    y += lineHeight;

    line = word + " ";

  }else{

    line = test;

  }

}

ctx.fillText(
  line.trim(),
  pad,
  y
);

ctx.restore();
  /* -----------------------------------------------
     CONVERT IMAGE
  ----------------------------------------------- */

  const image =
    canvas.toDataURL(
      "image/jpeg",
      0.88
    );


  document.getElementById(
    "capture"
  ).disabled = true;


  submitCapture(
    image
  );

}


/* =====================================================
   STOP CAMERA WHEN PAGE CLOSES
===================================================== */

window.addEventListener(
  "beforeunload",
  function(){

    stopCamera();

  }
);


/* =====================================================
   START CAMERA AUTOMATICALLY
===================================================== */

window.addEventListener(
  "load",
  function(){

    startCamera();

  }
);

</script>

</body>
</html>
