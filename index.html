<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aurum • Live GPS Camera</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f3f8fc;
  font-family:Arial,sans-serif;
  color:#102b50;
  display:flex;
  justify-content:center;
  min-height:100vh;
}

.wrap{
  width:min(560px,100%);
  padding:18px;
}

.card{
  background:#fff;
  border:1px solid #dbe4ef;
  border-radius:22px;
  padding:18px;
  box-shadow:0 16px 40px rgba(10,45,80,.12);
}

h1{
  font-size:24px;
  text-align:center;
  margin:4px 0;
}

.sub{
  text-align:center;
  color:#70809a;
  font-size:13px;
  margin:0 0 15px;
}

.info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:12px;
}

.info div{
  background:#f5f8fc;
  border:1px solid #dbe4ef;
  border-radius:12px;
  padding:9px;
}

.info small{
  display:block;
  color:#70809a;
  font-size:9px;
  font-weight:800;
  margin-bottom:4px;
}

.info strong{
  font-size:12px;
  line-height:1.25;
}

.camera{
  position:relative;
  background:#061d30;
  border-radius:18px;
  overflow:hidden;
  aspect-ratio:4/3;
}

video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transform:scaleX(-1);
}

.badge{
  position:absolute;
  left:12px;
  top:12px;
  background:#06111c;
  color:#fff;
  border-radius:18px;
  padding:7px 10px;
  font-size:10px;
  font-weight:800;
}

.dot{
  display:inline-block;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#ef3b35;
  margin-right:5px;
}

.status{
  text-align:center;
  font-size:12px;
  margin:12px 0;
  color:#08714f;
  font-weight:700;
  min-height:16px;
}

.actions{
  display:flex;
  gap:9px;
}

button{
  border:0;
  border-radius:12px;
  padding:13px 10px;
  font-weight:800;
  cursor:pointer;
  flex:1;
  font-size:13px;
}

.capture{
  background:#08714f;
  color:#fff;
}

.capture:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.retake{
  background:#e9f0f7;
  color:#102b50;
  display:none;
}

.close{
  background:#fff;
  border:1px solid #dbe4ef;
  color:#102b50;
  margin-top:9px;
  width:100%;
}

.msg{
  text-align:center;
  color:#b3261e;
  font-size:12px;
  font-weight:700;
  min-height:18px;
  margin-top:8px;
  line-height:1.4;
}

canvas{
  display:none;
}

@media(max-width:430px){
  .info{
    grid-template-columns:1fr;
  }

  .wrap{
    padding:10px;
  }

  .card{
    padding:13px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="card">

    <h1>LIVE GPS SELFIE</h1>

    <p class="sub">
      Aurum • Live camera capture
    </p>


    <div class="info">

      <div>
        <small>TM NAME</small>
        <strong id="tm">-</strong>
      </div>

      <div>
        <small>HQ</small>
        <strong id="hq">-</strong>
      </div>

      <div>
        <small>AREA / LOCATION</small>
        <strong id="area">-</strong>
      </div>

      <div>
        <small>EXACT LOCATION</small>
        <strong id="exact">-</strong>
      </div>

    </div>


    <div class="camera">

      <video
        id="video"
        autoplay
        playsinline
        muted>
      </video>

      <div class="badge">
        <span class="dot"></span>
        LIVE CAMERA
      </div>

    </div>


    <div id="status" class="status">
      Starting camera...
    </div>


    <div class="actions">

      <button
        id="capture"
        class="capture"
        onclick="capture()"
        disabled>
        📷 CAPTURE LIVE SELFIE
      </button>

      <button
        id="retake"
        class="retake"
        onclick="startCamera()">
        RETAKE
      </button>

    </div>


    <button
      class="close"
      onclick="goBack()">
      CLOSE CAMERA
    </button>


    <div
      id="msg"
      class="msg">
    </div>


    <canvas id="canvas"></canvas>

  </div>

</div>


<script>
const params =
  new URLSearchParams(location.search);

const tm =
  params.get("tm") || "-";

const hq =
  params.get("hq") || "-";

const tmCode =
  params.get("tmCode") || "";

const returnUrl =
  params.get("returnUrl") || "";

/* Location values are supplied by Aurum Sync after server-side reverse geocoding. */
let areaLocation = params.get("area") || "";
let exactLocation = params.get("exact") || "";

let latitude = Number(params.get("lat"));
let longitude = Number(params.get("lon"));
if(!Number.isFinite(latitude)) latitude = null;
if(!Number.isFinite(longitude)) longitude = null;

let stream = null;
let busy = false;
let locationReady = false;
let exactLocationReady = false;


/* =====================================================
   DISPLAY TM DETAILS
===================================================== */

document.getElementById("tm")
  .textContent = tm;

document.getElementById("hq")
  .textContent = hq;

document.getElementById("area")
  .textContent = areaLocation || "Location not available";

document.getElementById("exact")
  .textContent = exactLocation || "Location not available";


/* =====================================================
   STOP CAMERA
===================================================== */

function stopCamera(){

  if(stream){

    stream
      .getTracks()
      .forEach(function(track){
        track.stop();
      });

    stream = null;
  }
}


/* =====================================================
   UPDATE CAPTURE BUTTON
===================================================== */

function updateCaptureAvailability(){

  const captureBtn =
    document.getElementById("capture");

  captureBtn.disabled =
    !(
      stream &&
      locationReady &&
      exactLocationReady
    );
}


/* =====================================================
   GET EXACT LOCATION FROM APPS SCRIPT
   JSONP avoids cross-origin fetch/CORS issues.
===================================================== */

function getExactLocation(){
  /*
     ALWAYS resolve the address from the LIVE GPS coordinates.
     The INDEX page may send a fallback such as "Location captured";
     that value must NEVER be used in the final selfie stamp.
  */

  if(latitude === null || longitude === null){
    exactLocationReady = false;
    document.getElementById("area").textContent = "Location not available";
    document.getElementById("exact").textContent = "Location not available";
    updateCaptureAvailability();
    return;
  }

  const suppliedExact = String(params.get("exact") || "").trim();
  const suppliedArea = String(params.get("area") || "").trim();

  const badValues = [
    "Location captured",
    "Location not available",
    "Finding exact location...",
    "Finding area..."
  ];

  /* If INDEX has a genuine address, use it immediately. */
  if(
    suppliedExact &&
    badValues.indexOf(suppliedExact) === -1
  ){
    exactLocation = suppliedExact;
    areaLocation = suppliedArea || "";
    exactLocationReady = true;

    document.getElementById("area").textContent =
      areaLocation || "Location not available";
    document.getElementById("exact").textContent =
      exactLocation;

    document.getElementById("status").textContent =
      "✓ Camera + Location ready — capture when ready";
    document.getElementById("status").style.color = "#08714f";
    document.getElementById("msg").textContent = "";
    updateCaptureAvailability();
    return;
  }

  /* Otherwise ALWAYS reverse-geocode the live coordinates in Code.gs. */
  exactLocationReady = false;
  document.getElementById("area").textContent = "Finding area...";
  document.getElementById("exact").textContent = "Finding exact location...";
  document.getElementById("status").textContent =
    "✓ GPS received • Finding exact location...";
  document.getElementById("status").style.color = "#08714f";

  const callbackName = "__aurumGPS_" + Date.now();
  let script = null;
  let finished = false;

  function finish(data){
    if(finished) return;
    finished = true;

    data = data || {};

    const resolvedExact = String(data.exactLocation || "").trim();
    const resolvedArea = String(data.areaLocation || "").trim();

    if(
      resolvedExact &&
      badValues.indexOf(resolvedExact) === -1
    ){
      exactLocation = resolvedExact;
      areaLocation = resolvedArea || "";
      exactLocationReady = true;

      document.getElementById("area").textContent =
        areaLocation || "Location not available";
      document.getElementById("exact").textContent =
        exactLocation;

      document.getElementById("status").textContent =
        "✓ Camera + Location ready — capture when ready";
      document.getElementById("status").style.color = "#08714f";
      document.getElementById("msg").textContent = "";
      document.getElementById("msg").style.color = "#08714f";
    }else{
      exactLocation = "";
      areaLocation = resolvedArea || "";
      exactLocationReady = false;

      document.getElementById("area").textContent =
        areaLocation || "Location not available";
      document.getElementById("exact").textContent =
        "Location not available";

      document.getElementById("status").textContent =
        "✓ Camera ready • Exact location unavailable";
      document.getElementById("status").style.color = "#b3261e";
      document.getElementById("msg").textContent =
        "GPS address could not be resolved. Please refresh and allow Location.";
      document.getElementById("msg").style.color = "#b3261e";
    }

    updateCaptureAvailability();

    try{ delete window[callbackName]; }catch(e){}
    if(script && script.parentNode){
      script.parentNode.removeChild(script);
    }
  }

  window[callbackName] = finish;

  const apiUrl = new URL(returnUrl);
  apiUrl.search = "";
  apiUrl.hash = "";
  apiUrl.searchParams.set("api", "getGPSLocationDetails");
  apiUrl.searchParams.set("arg0", String(latitude));
  apiUrl.searchParams.set("arg1", String(longitude));
  apiUrl.searchParams.set("callback", callbackName);
  apiUrl.searchParams.set("_", String(Date.now()));

  script = document.createElement("script");
  script.src = apiUrl.toString();
  script.async = true;
  script.onerror = function(){ finish({}); };
  document.head.appendChild(script);

  setTimeout(function(){
    if(!finished) finish({});
  }, 20000);
}

/* =====================================================
   REQUEST LIVE LOCATION
===================================================== */

function startLiveLocation(){

  /* If Aurum Sync supplied live GPS + resolved addresses, use them directly. */
  if(latitude !== null && longitude !== null && exactLocation && areaLocation){
    locationReady = true;
    exactLocationReady = true;
    document.getElementById("area").textContent = areaLocation;
    document.getElementById("exact").textContent = exactLocation;
    document.getElementById("status").textContent = "✓ Location verified • Requesting Camera permission...";
    document.getElementById("status").style.color = "#08714f";
    startCamera();
    return;
  }

  const status =
    document.getElementById("status");

  const msg =
    document.getElementById("msg");

  if(!navigator.geolocation){

    status.textContent =
      "Location permission required";

    status.style.color =
      "#b3261e";

    msg.textContent =
      "Location is not supported on this device.";

    updateCaptureAvailability();

    return;
  }

  status.textContent =
    "Requesting Location permission...";

  status.style.color =
    "#08714f";

  msg.textContent =
    "Please tap Allow for Location.";

  navigator.geolocation.getCurrentPosition(

    function(position){

      latitude =
        Number(position.coords.latitude);

      longitude =
        Number(position.coords.longitude);

      locationReady = true;

      status.textContent =
        "✓ Location permission granted";

      status.style.color =
        "#08714f";

      msg.textContent =
        "Requesting Camera permission...";

      getExactLocation();

      /*
        Camera permission is requested only after
        the live location has been obtained.
      */
      startCamera();

    },

    function(error){

      locationReady = false;

      status.textContent =
        "Location permission required";

      status.style.color =
        "#b3261e";

      if(
        error &&
        error.code === 1
      ){
        msg.textContent =
          "Location access was denied. Chrome Site Settings → Location → Allow, then refresh.";
      }else{
        msg.textContent =
          "Unable to get live location. Please allow Location access and try again.";
      }

      updateCaptureAvailability();
    },

    {
      enableHighAccuracy:true,
      timeout:15000,
      maximumAge:0
    }
  );
}


/* =====================================================
   REQUEST CAMERA
===================================================== */

async function startCamera(){

  const status =
    document.getElementById("status");

  const msg =
    document.getElementById("msg");

  const captureBtn =
    document.getElementById("capture");

  const retakeBtn =
    document.getElementById("retake");

  captureBtn.disabled = true;

  retakeBtn.style.display = "none";

  stopCamera();

  try{

    if(!window.isSecureContext){
      throw new Error(
        "Camera requires a secure HTTPS page."
      );
    }

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){
      throw new Error(
        "Camera API is not available in this browser."
      );
    }

    status.textContent =
      "Requesting Camera permission...";

    status.style.color =
      "#08714f";

    const newStream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:{
            ideal:"user"
          },
          width:{
            ideal:1280
          },
          height:{
            ideal:960
          }
        },

        audio:false
      });

    stream = newStream;

    const video =
      document.getElementById("video");

    video.srcObject =
      stream;

    await video.play();

    status.textContent =
      exactLocationReady
        ? "✓ Camera + Location ready — capture when ready"
        : "✓ Camera ready • Verifying exact location...";

    status.style.color =
      "#08714f";

    msg.textContent =
      exactLocationReady
        ? ""
        : "Please wait for exact location verification.";

    updateCaptureAvailability();

  }catch(error){

    console.error(
      "Camera Error:",
      error
    );

    status.textContent =
      "Camera permission required";

    status.style.color =
      "#b3261e";

    if(
      error &&
      error.name === "NotAllowedError"
    ){

      msg.textContent =
        "Camera access was denied. Chrome Site Settings → Camera → Allow for giovanni-gautam.github.io, then refresh.";

    }else if(
      error &&
      error.name === "NotFoundError"
    ){

      msg.textContent =
        "No camera was found on this device.";

    }else if(
      error &&
      error.name === "NotReadableError"
    ){

      msg.textContent =
        "Camera is already being used by another application.";

    }else{

      msg.textContent =
        error.message ||
        "Please allow camera access.";
    }

    updateCaptureAvailability();
  }
}


/* =====================================================
   CAPTURE
===================================================== */

function capture(){

  if(
    busy ||
    !stream ||
    !locationReady ||
    !exactLocationReady ||
    !exactLocation ||
    exactLocation === "Location captured" ||
    exactLocation === "Location not available"
  ){
    return;
  }

  busy = true;

  const video =
    document.getElementById("video");

  const canvas =
    document.getElementById("canvas");

  const ctx =
    canvas.getContext("2d");

  if(!video.videoWidth){

    busy = false;
    return;
  }

  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;

  /* Mirror correction */
  ctx.save();

  ctx.translate(
    canvas.width,
    0
  );

  ctx.scale(-1,1);

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.restore();


  /* =================================================
     STAMP
     AURUM
     TM
     DATE/TIME
     LOCATION
  ================================================= */

  const stampHeight =
    Math.max(
      185,
      Math.round(
        canvas.height * 0.30
      )
    );

  const stampY =
    canvas.height -
    stampHeight;

  const pad =
    Math.max(
      18,
      Math.round(
        canvas.width * 0.025
      )
    );

  ctx.save();

  ctx.fillStyle =
    "rgba(0,0,0,0.76)";

  ctx.fillRect(
    0,
    stampY,
    canvas.width,
    stampHeight
  );

  const titleSize =
    Math.max(
      22,
      Math.round(
        canvas.width * 0.032
      )
    );

  const textSize =
    Math.max(
      18,
      Math.round(
        canvas.width * 0.022
      )
    );

  ctx.fillStyle =
    "#ffffff";

  ctx.font =
    "800 " +
    titleSize +
    "px Arial";

  ctx.fillText(
    "AURUM • LIVE GPS VERIFIED",
    pad,
    stampY +
    titleSize +
    10
  );

  ctx.font =
    "700 " +
    textSize +
    "px Arial";

  ctx.fillText(
    "TM: " + tm,
    pad,
    stampY +
    titleSize +
    textSize +
    25
  );

  const dateTime =
    new Date().toLocaleString(
      "en-IN",
      {
        day:"2-digit",
        month:"short",
        year:"numeric",
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit"
      }
    );

  ctx.font =
    "600 " +
    Math.max(
      16,
      Math.round(
        canvas.width * 0.020
      )
    ) +
    "px Arial";

  ctx.fillText(
    dateTime,
    pad,
    stampY +
    titleSize +
    (textSize * 2) +
    40
  );


  /* LOCATION PIN */
  const pinX = pad + 8;
  const pinY =
    stampY +
    titleSize +
    (textSize * 3) +
    67;

  ctx.beginPath();
  ctx.arc(
    pinX,
    pinY,
    7,
    0,
    Math.PI * 2
  );
  ctx.fillStyle = "#ffffff";
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(
    pinX - 6,
    pinY + 5
  );
  ctx.lineTo(
    pinX,
    pinY + 14
  );
  ctx.lineTo(
    pinX + 6,
    pinY + 5
  );
  ctx.closePath();
  ctx.fill();


  const maxWidth =
    canvas.width -
    (pad * 2) -
    30;

  let line =
    "📍 EXACT LOCATION: ";

  let y =
    stampY +
    titleSize +
    (textSize * 3) +
    55;

  const lineHeight =
    Math.max(
      22,
      Math.round(
        canvas.width * 0.026
      )
    );

  const stampExactLocation =
    String(exactLocation || "").trim();

  /* Never stamp the generic "Location captured" text. */
  const words =
    (
      stampExactLocation ||
      "Location not available"
    ).split(" ");

  words.forEach(function(word){

    const test =
      line +
      word +
      " ";

    if(
      ctx.measureText(test).width >
      maxWidth &&
      line !== "📍 EXACT LOCATION: "
    ){

      ctx.fillText(
        line.trim(),
        pad + 22,
        y
      );

      y += lineHeight;

      line =
        "            " +
        word +
        " ";

    }else{

      line = test;

    }
  });

  ctx.fillText(
    line.trim(),
    pad + 22,
    y
  );

  ctx.restore();


  const image =
    canvas.toDataURL(
      "image/jpeg",
      0.90
    );

  document.getElementById("capture")
    .disabled = true;

  submitCapture(image);
}


/* =====================================================
   SUBMIT FROM SAME-TAB CAMERA
   Uses normal HTML form POST — no CORS/fetch.
===================================================== */

function submitCapture(image){

  const status =
    document.getElementById("status");

  const msg =
    document.getElementById("msg");

  if(
    !returnUrl ||
    !tmCode ||
    latitude === null ||
    longitude === null ||
    !image
  ){

    status.textContent =
      "Submission data missing";

    status.style.color =
      "#b3261e";

    msg.textContent =
      "Please reopen LIVE GPS SELFIE from Aurum Sync.";

    busy = false;

    return;
  }

  status.textContent =
    "✓ Selfie captured";

  status.style.color =
    "#08714f";

  msg.textContent =
    "Submitting selfie to Aurum Sync...";

  msg.style.color =
    "#08714f";

  stopCamera();

  const form =
    document.createElement("form");

  form.method =
    "POST";

  form.action =
    returnUrl;

  form.target =
    "_self";

  form.style.display =
    "none";


  function addField(
    name,
    value
  ){

    const input =
      document.createElement("input");

    input.type =
      "hidden";

    input.name =
      name;

    input.value =
      value;

    form.appendChild(input);
  }


  addField(
    "tmCode",
    tmCode
  );

  addField(
    "latitude",
    String(latitude)
  );

  addField(
    "longitude",
    String(longitude)
  );

  addField(
    "image",
    image
  );

  addField(
    "area",
    areaLocation || ""
  );

  addField(
    "exactLocation",
    exactLocation || ""
  );

  /*
    Apps Script doPost uses this URL to return to
    the portal after the selfie is saved.
  */
  addField(
    "returnUrl",
    returnUrl
  );

  document.body.appendChild(form);

  form.submit();
}


/* =====================================================
   RETAKE
===================================================== */

document.getElementById("retake")
  .addEventListener(
    "click",
    function(){

      busy = false;
      startCamera();

    }
  );


/* =====================================================
   CLOSE / BACK
===================================================== */

function goBack(){

  stopCamera();

  if(returnUrl){
    window.location.href =
      returnUrl;
  }else{
    window.history.back();
  }
}


/* =====================================================
   START AUTOMATICALLY
===================================================== */

window.addEventListener(
  "load",
  function(){

    /*
      Location permission first.
      Then camera permission.
      User only presses CAPTURE after both
      permissions have been granted.
    */
    startLiveLocation();

  }
);


/* =====================================================
   STOP CAMERA ON EXIT
===================================================== */

window.addEventListener(
  "beforeunload",
  function(){
    stopCamera();
  }
);

</script>

</body>
</html>
