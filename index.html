<!-- AURUM LIVE GPS CAMERA FINAL FIXED - 2026-09-18 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aurum • Live GPS Camera</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f3f8fc;
  font-family:Arial,sans-serif;
  color:#102b50;
  display:flex;
  justify-content:center;
  min-height:100vh;
}

.wrap{
  width:min(560px,100%);
  padding:18px;
}

.card{
  background:#fff;
  border:1px solid #dbe4ef;
  border-radius:22px;
  padding:18px;
  box-shadow:0 16px 40px rgba(10,45,80,.12);
}

h1{
  font-size:24px;
  text-align:center;
  margin:4px 0;
}

.sub{
  text-align:center;
  color:#70809a;
  font-size:13px;
  margin:0 0 15px;
}

.info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:12px;
}

.info div{
  background:#f5f8fc;
  border:1px solid #dbe4ef;
  border-radius:12px;
  padding:9px;
}

.info small{
  display:block;
  color:#70809a;
  font-size:9px;
  font-weight:800;
  margin-bottom:4px;
}

.info strong{
  font-size:12px;
  line-height:1.25;
}

.camera{
  position:relative;
  background:#061d30;
  border-radius:18px;
  overflow:hidden;
  aspect-ratio:4/3;
}

video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transform:scaleX(-1);
}

.badge{
  position:absolute;
  left:12px;
  top:12px;
  background:#06111c;
  color:#fff;
  border-radius:18px;
  padding:7px 10px;
  font-size:10px;
  font-weight:800;
}

.dot{
  display:inline-block;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#ef3b35;
  margin-right:5px;
}

.status{
  text-align:center;
  font-size:12px;
  margin:12px 0;
  color:#08714f;
  font-weight:700;
  min-height:16px;
}

.actions{
  display:flex;
  gap:9px;
}

button{
  border:0;
  border-radius:12px;
  padding:13px 10px;
  font-weight:800;
  cursor:pointer;
  flex:1;
  font-size:13px;
}

.capture{
  background:#08714f;
  color:#fff;
}

.capture:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.retake{
  background:#e9f0f7;
  color:#102b50;
  display:none;
}

.close{
  background:#fff;
  border:1px solid #dbe4ef;
  color:#102b50;
  margin-top:9px;
  width:100%;
}

.msg{
  text-align:center;
  color:#b3261e;
  font-size:12px;
  font-weight:700;
  min-height:18px;
  margin-top:8px;
  line-height:1.4;
}

canvas{
  display:none;
}

@media(max-width:430px){
  .info{
    grid-template-columns:1fr;
  }

  .wrap{
    padding:10px;
  }

  .card{
    padding:13px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="card">

    <h1>LIVE GPS SELFIE</h1>

    <p class="sub">
      Aurum • Live camera capture
    </p>


    <div class="info">

      <div>
        <small>TM NAME</small>
        <strong id="tm">-</strong>
      </div>

      <div>
        <small>HQ</small>
        <strong id="hq">-</strong>
      </div>

      <div>
        <small>AREA / LOCATION</small>
        <strong id="area">-</strong>
      </div>

      <div>
        <small>EXACT LOCATION</small>
        <strong id="exact">-</strong>
      </div>

    </div>


    <div class="camera">

      <video
        id="video"
        autoplay
        playsinline
        muted>
      </video>

      <div class="badge">
        <span class="dot"></span>
        LIVE CAMERA
      </div>

    </div>


    <div id="status" class="status">
      Starting camera...
    </div>


    <div class="actions">

      <button
        id="capture"
        class="capture"
        onclick="capture()"
        disabled>
        📷 CAPTURE LIVE SELFIE
      </button>

      <button
        id="retake"
        class="retake"
        onclick="startCamera()">
        RETAKE
      </button>

    </div>


    <button
      class="close"
      onclick="goBack()">
      CLOSE CAMERA
    </button>


    <div
      id="msg"
      class="msg">
    </div>


    <canvas id="canvas"></canvas>

  </div>

</div>


<script>
const params =
  new URLSearchParams(
    location.search
  );

const tm =
  params.get("tm") || "-";

const hq =
  params.get("hq") || "-";

const tmCode =
  params.get("tmCode") || "";

const returnUrl =
  params.get("returnUrl") || "";

let latitude = null;
let longitude = null;
let gpsAccuracy = null;

let areaLocation = "";
let exactLocation = "";

let stream = null;
let gpsWatchId = null;
let gpsTimer = null;

let locationReady = false;
let exactLocationReady = false;
let busy = false;


/* =====================================================
   DISPLAY
===================================================== */

document.getElementById("tm")
  .textContent =
  tm;

document.getElementById("hq")
  .textContent =
  hq;

document.getElementById("area")
  .textContent =
  "Acquiring precise GPS...";

document.getElementById("exact")
  .textContent =
  "Waiting for exact address...";


/* =====================================================
   CAPTURE BUTTON STATE
===================================================== */

function updateCaptureAvailability(){

  const button =
    document.getElementById("capture");

  button.disabled =
    !(
      stream &&
      locationReady &&
      exactLocationReady &&
      exactLocation
    );
}


/* =====================================================
   STOP CAMERA
===================================================== */

function stopCamera(){

  if(stream){

    stream
      .getTracks()
      .forEach(
        function(track){
          track.stop();
        }
      );

    stream = null;
  }

}


/* =====================================================
   REQUEST CAMERA
===================================================== */

async function startCamera(){

  const status =
    document.getElementById("status");

  const msg =
    document.getElementById("msg");


  try{

    if(!window.isSecureContext){

      throw new Error(
        "Camera requires a secure HTTPS page."
      );

    }

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        "Camera API is not available in this browser."
      );

    }


    status.textContent =
      "Requesting Camera permission...";

    status.style.color =
      "#08714f";


    const newStream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:{
            ideal:"user"
          },

          width:{
            ideal:1280
          },

          height:{
            ideal:960
          }
        },

        audio:false

      });


    stream =
      newStream;


    const video =
      document.getElementById("video");


    video.srcObject =
      stream;


    await video.play();


    status.textContent =
      exactLocationReady
        ? "✓ Camera + Exact GPS ready — capture when ready"
        : "✓ Camera ready • Waiting for exact GPS address...";


    status.style.color =
      exactLocationReady
        ? "#08714f"
        : "#b3261e";


    updateCaptureAvailability();


  }catch(error){

    console.error(
      "Camera Error:",
      error
    );


    status.textContent =
      "Camera permission required";

    status.style.color =
      "#b3261e";


    if(
      error &&
      error.name === "NotAllowedError"
    ){

      msg.textContent =
        "Camera access was denied. Chrome Site Settings → Camera → Allow for giovanni-gautam.github.io, then refresh.";

    }else if(
      error &&
      error.name === "NotFoundError"
    ){

      msg.textContent =
        "No camera was found on this device.";

    }else if(
      error &&
      error.name === "NotReadableError"
    ){

      msg.textContent =
        "Camera is already being used by another application.";

    }else{

      msg.textContent =
        error.message ||
        "Please allow camera access.";

    }


    updateCaptureAvailability();

  }
}


/* =====================================================
   SEND GPS TO AURUM SYNC
===================================================== */

let bestSentAccuracy = null;

function sendGPSToParent(
  position
){

  const coords =
    position &&
    position.coords;

  if(!coords){
    return;
  }


  const lat =
    Number(
      coords.latitude
    );

  const lon =
    Number(
      coords.longitude
    );

  const accuracy =
    Number(
      coords.accuracy
    );


  if(
    !Number.isFinite(lat) ||
    !Number.isFinite(lon)
  ){

    return;
  }


  /*
   * Only forward a better/equally useful reading.
   */
  if(
    Number.isFinite(accuracy) &&
    Number.isFinite(bestSentAccuracy) &&
    accuracy >= bestSentAccuracy - 2
  ){

    return;
  }


  latitude =
    lat;

  longitude =
    lon;

  gpsAccuracy =
    Number.isFinite(accuracy)
      ? accuracy
      : null;

  bestSentAccuracy =
    gpsAccuracy;


  document.getElementById("area")
    .textContent =
    "Resolving exact address...";


  document.getElementById("exact")
    .textContent =
    "Waiting for exact address...";


  document.getElementById("status")
    .textContent =
    "✓ Precise GPS received • Verifying address...";


  document.getElementById("status")
    .style.color =
    "#08714f";


  document.getElementById("msg")
    .textContent =
    "GPS accuracy • ±" +
    (
      gpsAccuracy !== null
        ? Math.round(gpsAccuracy)
        : "?"
    ) +
    " m. Waiting for exact address verification.";


  document.getElementById("msg")
    .style.color =
    "#08714f";


  if(
    window.opener &&
    !window.opener.closed
  ){

    try{

      window.opener.postMessage(
        {
          type:
            "AURUM_GPS_COORDINATES",

          latitude:
            latitude,

          longitude:
            longitude,

          accuracy:
            gpsAccuracy
        },
        "*"
      );

    }catch(error){

      console.error(
        "GPS transfer error:",
        error
      );

    }

  }


  updateCaptureAvailability();
}


/* =====================================================
   START PRECISE GPS
===================================================== */

function startPreciseGPS(){

  if(
    !navigator.geolocation
  ){

    document.getElementById("status")
      .textContent =
      "Location permission required";


    document.getElementById("status")
      .style.color =
      "#b3261e";


    document.getElementById("msg")
      .textContent =
      "This device/browser does not support GPS location.";


    updateCaptureAvailability();

    return;
  }


  document.getElementById("status")
    .textContent =
    "Requesting precise GPS location...";


  document.getElementById("status")
    .style.color =
    "#08714f";


  document.getElementById("msg")
    .textContent =
    "Please tap Allow for Location.";


  /*
   * Immediate high-accuracy fix.
   */
  navigator.geolocation.getCurrentPosition(

    function(position){
      sendGPSToParent(position);
    },

    function(error){

      if(
        error &&
        error.code === 1
      ){

        document.getElementById("status")
          .textContent =
          "Location permission required";

        document.getElementById("msg")
          .textContent =
          "Location access was denied. Chrome Site Settings → Location → Allow, then refresh.";

      }else{

        document.getElementById("status")
          .textContent =
          "Unable to acquire precise GPS";

        document.getElementById("msg")
          .textContent =
          "Please allow Location access and try again.";

      }

      document.getElementById("status")
        .style.color =
        "#b3261e";

      updateCaptureAvailability();

    },

    {
      enableHighAccuracy:true,
      timeout:15000,
      maximumAge:0
    }

  );


  /*
   * Continue watching briefly so we can use the best
   * accuracy reported by the device.
   */
  try{

    gpsWatchId =
      navigator.geolocation.watchPosition(

        function(position){
          sendGPSToParent(position);
        },

        function(error){
          console.warn(
            "GPS watch error:",
            error
          );
        },

        {
          enableHighAccuracy:true,
          timeout:10000,
          maximumAge:0
        }

      );


    gpsTimer =
      setTimeout(
        function(){

          if(
            gpsWatchId !== null
          ){

            navigator.geolocation.clearWatch(
              gpsWatchId
            );

            gpsWatchId =
              null;

          }

        },
        7000
      );

  }catch(error){

    console.warn(
      "GPS watch unavailable:",
      error
    );

  }

}


/* =====================================================
   RECEIVE VERIFIED ADDRESS FROM PARENT
===================================================== */

window.addEventListener(
  "message",
  function(event){

    if(
      !window.opener ||
      event.source !== window.opener
    ){

      return;
    }


    const data =
      event.data || {};


    if(
      data.type ===
      "AURUM_GPS_LOCATION_WAITING"
    ){

      exactLocationReady =
        false;

      document.getElementById("status")
        .textContent =
        "✓ GPS received • Exact address still resolving...";

      document.getElementById("status")
        .style.color =
        "#b3261e";

      document.getElementById("msg")
        .textContent =
        "Please wait a moment for exact GPS address verification.";

      updateCaptureAvailability();

      return;
    }


    if(
      data.type ===
      "AURUM_GPS_LOCATION_ERROR"
    ){

      exactLocationReady =
        false;

      document.getElementById("exact")
        .textContent =
        "Exact address unavailable";

      document.getElementById("status")
        .textContent =
        "GPS received • Exact address unavailable";

      document.getElementById("status")
        .style.color =
        "#b3261e";

      document.getElementById("msg")
        .textContent =
        data.message ||
        "Exact GPS address could not be resolved. Please try again.";

      updateCaptureAvailability();

      return;
    }


    if(
      data.type ===
      "AURUM_GPS_LOCATION_RESOLVED"
    ){

      latitude =
        Number(data.latitude);

      longitude =
        Number(data.longitude);

      gpsAccuracy =
        Number(data.accuracy);

      if(
        !Number.isFinite(gpsAccuracy)
      ){

        gpsAccuracy =
          null;

      }


      areaLocation =
        String(
          data.area || ""
        ).trim();

      exactLocation =
        String(
          data.exactLocation || ""
        ).trim();


      if(
        !exactLocation ||
        exactLocation === "Location captured" ||
        exactLocation === "Location not available"
      ){

        exactLocationReady =
          false;

        document.getElementById("exact")
          .textContent =
          "Exact address unavailable";

        document.getElementById("status")
          .textContent =
          "GPS received • Exact address unavailable";

        document.getElementById("status")
          .style.color =
          "#b3261e";

        updateCaptureAvailability();

        return;
      }


      locationReady =
        true;

      exactLocationReady =
        true;


      document.getElementById("area")
        .textContent =
        areaLocation ||
        exactLocation;


      document.getElementById("exact")
        .textContent =
        exactLocation;


      document.getElementById("status")
        .textContent =
        "✓ Camera + Exact GPS ready" +
        (
          gpsAccuracy !== null
            ? " • ±" +
              Math.round(gpsAccuracy) +
              " m"
            : ""
        ) +
        " — capture when ready";


      document.getElementById("status")
        .style.color =
        "#08714f";


      document.getElementById("msg")
        .textContent =
        "Exact GPS address verified. You can capture now.";


      document.getElementById("msg")
        .style.color =
        "#08714f";


      updateCaptureAvailability();

      return;
    }


    if(
      data.type ===
      "AURUM_GPS_SELFIE_SAVED"
    ){

      document.getElementById("status")
        .textContent =
        "✓ LIVE GPS SELFIE SAVED";

      document.getElementById("status")
        .style.color =
        "#08714f";

      document.getElementById("msg")
        .textContent =
        data.message ||
        "Selfie saved successfully. Returning to Aurum Sync...";

      document.getElementById("msg")
        .style.color =
        "#08714f";


      stopCamera();


      setTimeout(
        function(){

          try{
            window.close();
          }catch(error){}

        },
        700
      );

      return;
    }


    if(
      data.type ===
      "AURUM_GPS_SELFIE_SAVE_FAILED"
    ){

      busy =
        false;

      document.getElementById("status")
        .textContent =
        "Submission failed";

      document.getElementById("status")
        .style.color =
        "#b3261e";

      document.getElementById("msg")
        .textContent =
        data.message ||
        "Selfie could not be saved. Please try again.";

      document.getElementById("msg")
        .style.color =
        "#b3261e";


      document.getElementById("capture")
        .disabled =
        false;


      return;
    }

  }
);


/* =====================================================
   CAPTURE STAMPED SELFIE
===================================================== */

function capture(){

  if(
    busy ||
    !stream ||
    !locationReady ||
    !exactLocationReady ||
    !exactLocation ||
    latitude === null ||
    longitude === null
  ){

    return;
  }


  busy =
    true;


  document.getElementById("capture")
    .disabled =
    true;


  const video =
    document.getElementById("video");

  const canvas =
    document.getElementById("canvas");

  const ctx =
    canvas.getContext("2d");


  if(
    !video.videoWidth ||
    !video.videoHeight
  ){

    busy =
      false;

    updateCaptureAvailability();

    return;
  }


  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;


  /*
   * Mirror selfie.
   */
  ctx.save();

  ctx.translate(
    canvas.width,
    0
  );

  ctx.scale(
    -1,
    1
  );

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.restore();


  /*
   * ---------------------------------------------------
   * VERIFIED GPS STAMP
   * ---------------------------------------------------
   */
  const pad =
    Math.max(
      24,
      Math.round(
        canvas.width * 0.026
      )
    );

  const titleSize =
    Math.max(
      22,
      Math.round(
        canvas.width * 0.032
      )
    );

  const bodySize =
    Math.max(
      17,
      Math.round(
        canvas.width * 0.021
      )
    );

  const smallSize =
    Math.max(
      15,
      Math.round(
        canvas.width * 0.018
      )
    );

  const maxTextWidth =
    canvas.width -
    (pad * 2);


  function wrapText(
    text,
    font,
    maxWidth
  ){

    ctx.font =
      font;

    const words =
      String(text || "")
        .split(/\s+/)
        .filter(Boolean);

    const lines = [];

    let line =
      "";

    words.forEach(
      function(word){

        const test =
          line
            ? line +
              " " +
              word
            : word;


        if(
          ctx.measureText(test)
            .width >
          maxWidth &&
          line
        ){

          lines.push(
            line
          );

          line =
            word;

        }else{

          line =
            test;

        }

      }
    );


    if(line){
      lines.push(line);
    }


    return lines.length
      ? lines
      : [""];
  }


  const locationLines =
    wrapText(
      exactLocation,
      "700 " +
      bodySize +
      "px Arial",
      maxTextWidth
    );


  const gpsText =
    "GPS: " +
    Number(latitude)
      .toFixed(6) +
    ", " +
    Number(longitude)
      .toFixed(6) +
    (
      gpsAccuracy !== null
        ? " • Accuracy ±" +
          Math.round(
            gpsAccuracy
          ) +
          " m"
        : ""
    );


  const dateText =
    new Date()
      .toLocaleString(
        "en-IN",
        {
          day:"2-digit",
          month:"short",
          year:"numeric",
          hour:"2-digit",
          minute:"2-digit",
          second:"2-digit"
        }
      );


  const lineHeight =
    Math.max(
      24,
      Math.round(
        canvas.width * 0.027
      )
    );


  const stampHeight =
    Math.max(
      190,
      (
        34 +
        titleSize +
        13 +
        bodySize +
        10 +
        smallSize +
        14 +
        bodySize +
        8 +
        locationLines.length *
          lineHeight +
        12 +
        smallSize +
        20
      )
    );


  const stampY =
    canvas.height -
    stampHeight;


  ctx.save();


  ctx.fillStyle =
    "rgba(0,0,0,0.80)";

  ctx.fillRect(
    0,
    stampY,
    canvas.width,
    stampHeight
  );


  let y =
    stampY +
    34;


  ctx.fillStyle =
    "#ffffff";


  ctx.font =
    "800 " +
    titleSize +
    "px Arial";


  ctx.fillText(
    "AURUM • LIVE GPS VERIFIED",
    pad,
    y
  );


  y +=
    titleSize +
    13;


  ctx.font =
    "700 " +
    bodySize +
    "px Arial";


  ctx.fillText(
    "TM: " +
    tm,
    pad,
    y
  );


  y +=
    bodySize +
    10;


  ctx.font =
    "600 " +
    smallSize +
    "px Arial";


  ctx.fillText(
    "DATE / TIME: " +
    dateText,
    pad,
    y
  );


  y +=
    smallSize +
    14;


  ctx.font =
    "700 " +
    bodySize +
    "px Arial";


  ctx.fillText(
    "📍 EXACT LOCATION:",
    pad,
    y
  );


  y +=
    bodySize +
    8;


  ctx.font =
    "700 " +
    bodySize +
    "px Arial";


  locationLines.forEach(
    function(line){

      ctx.fillText(
        line,
        pad,
        y
      );

      y +=
        lineHeight;
    }
  );


  ctx.font =
    "600 " +
    smallSize +
    "px Arial";


  ctx.fillText(
    gpsText,
    pad,
    y + 2
  );


  ctx.restore();


  const image =
    canvas.toDataURL(
      "image/jpeg",
      0.92
    );


  document.getElementById("status")
    .textContent =
    "✓ Selfie captured • Saving to Aurum Sync...";

  document.getElementById("status")
    .style.color =
    "#08714f";


  document.getElementById("msg")
    .textContent =
    "Please wait while the stamped selfie is saved.";

  document.getElementById("msg")
    .style.color =
    "#08714f";


  /*
   * Send the stamped image directly to the parent page.
   * No fetch, CORS, form navigation or blank response page.
   */
  if(
    window.opener &&
    !window.opener.closed
  ){

    try{

      window.opener.postMessage(
        {
          type:
            "AURUM_GPS_SELFIE_CAPTURE",

          image:
            image,

          tmCode:
            tmCode,

          latitude:
            Number(latitude),

          longitude:
            Number(longitude),

          accuracy:
            gpsAccuracy,

          area:
            areaLocation,

          exactLocation:
            exactLocation

        },
        "*"
      );

      stopCamera();

    }catch(error){

      console.error(
        "Capture transfer error:",
        error
      );

      busy =
        false;

      document.getElementById("status")
        .textContent =
        "Transfer failed";

      document.getElementById("status")
        .style.color =
        "#b3261e";

      document.getElementById("msg")
        .textContent =
        "Unable to send the selfie back to Aurum Sync. Please try again.";

      document.getElementById("msg")
        .style.color =
        "#b3261e";

      updateCaptureAvailability();

    }

  }else{

    busy =
      false;

    document.getElementById("status")
      .textContent =
      "Aurum Sync window unavailable";

    document.getElementById("status")
      .style.color =
      "#b3261e";

    document.getElementById("msg")
      .textContent =
      "Please reopen LIVE GPS SELFIE from Aurum Sync.";

    document.getElementById("msg")
      .style.color =
      "#b3261e";

    updateCaptureAvailability();

  }

}


/* =====================================================
   RETAKE
===================================================== */

function retake(){

  busy =
    false;

  document.getElementById("capture")
    .disabled =
    !(
      stream &&
      locationReady &&
      exactLocationReady &&
      exactLocation
    );


  document.getElementById("retake")
    .style.display =
    "none";


  document.getElementById("msg")
    .textContent =
    "";


  startCamera();

}


/* =====================================================
   CLOSE CAMERA
===================================================== */

function goBack(){

  stopCamera();

  if(
    gpsWatchId !== null
  ){

    try{

      navigator.geolocation
        .clearWatch(
          gpsWatchId
        );

    }catch(error){}

    gpsWatchId =
      null;
  }


  if(
    gpsTimer !== null
  ){

    clearTimeout(
      gpsTimer
    );

    gpsTimer =
      null;
  }


  if(returnUrl){

    window.location.href =
      returnUrl;

  }else{

    window.history.back();

  }

}


/* =====================================================
   START
===================================================== */

window.addEventListener(
  "load",
  function(){

    /*
     * Camera and GPS start immediately.
     * They run in parallel to minimize delay.
     */
    startCamera();
    startPreciseGPS();

  }
);


/* =====================================================
   STOP ON EXIT
===================================================== */

window.addEventListener(
  "beforeunload",
  function(){

    stopCamera();

    if(
      gpsWatchId !== null
    ){

      try{

        navigator.geolocation
          .clearWatch(
            gpsWatchId
          );

      }catch(error){}

    }

  }
);
</script>
