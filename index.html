<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aurum • Live GPS Camera</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f3f8fc;
  font-family:Arial,sans-serif;
  color:#102b50;
  display:flex;
  justify-content:center;
  min-height:100vh;
}

.wrap{
  width:min(560px,100%);
  padding:18px;
}

.card{
  background:#fff;
  border:1px solid #dbe4ef;
  border-radius:22px;
  padding:18px;
  box-shadow:0 16px 40px rgba(10,45,80,.12);
}

h1{
  font-size:24px;
  text-align:center;
  margin:4px 0;
}

.sub{
  text-align:center;
  color:#70809a;
  font-size:13px;
  margin:0 0 15px;
}

.info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:12px;
}

.info div{
  background:#f5f8fc;
  border:1px solid #dbe4ef;
  border-radius:12px;
  padding:9px;
}

.info small{
  display:block;
  color:#70809a;
  font-size:9px;
  font-weight:800;
  margin-bottom:4px;
}

.info strong{
  font-size:12px;
  line-height:1.25;
}

.camera{
  position:relative;
  background:#061d30;
  border-radius:18px;
  overflow:hidden;
  aspect-ratio:4/3;
}

video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transform:scaleX(-1);
}

.badge{
  position:absolute;
  left:12px;
  top:12px;
  background:#06111c;
  color:#fff;
  border-radius:18px;
  padding:7px 10px;
  font-size:10px;
  font-weight:800;
}

.dot{
  display:inline-block;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#ef3b35;
  margin-right:5px;
}

.status{
  text-align:center;
  font-size:12px;
  margin:12px 0;
  color:#08714f;
  font-weight:700;
  min-height:16px;
}

.actions{
  display:flex;
  gap:9px;
}

button{
  border:0;
  border-radius:12px;
  padding:13px 10px;
  font-weight:800;
  cursor:pointer;
  flex:1;
  font-size:13px;
}

.capture{
  background:#08714f;
  color:#fff;
}

.capture:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.retake{
  background:#e9f0f7;
  color:#102b50;
  display:none;
}

.close{
  background:#fff;
  border:1px solid #dbe4ef;
  color:#102b50;
  margin-top:9px;
  width:100%;
}

.msg{
  text-align:center;
  color:#b3261e;
  font-size:12px;
  font-weight:700;
  min-height:18px;
  margin-top:8px;
  line-height:1.4;
}

canvas{
  display:none;
}

@media(max-width:430px){
  .info{
    grid-template-columns:1fr;
  }

  .wrap{
    padding:10px;
  }

  .card{
    padding:13px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="card">

    <h1>LIVE GPS SELFIE</h1>

    <p class="sub">
      Aurum • Live camera capture
    </p>

    <div class="info">

      <div>
        <small>TM NAME</small>
        <strong id="tm">-</strong>
      </div>

      <div>
        <small>HQ</small>
        <strong id="hq">-</strong>
      </div>

      <div style="grid-column:1/-1">
        <small>EXACT LOCATION</small>
        <strong id="area">-</strong>
      </div>

    </div>

    <div class="camera">

      <video
        id="video"
        autoplay
        playsinline
        muted>
      </video>

      <div class="badge">
        <span class="dot"></span>
        LIVE CAMERA
      </div>

    </div>

    <div id="status" class="status">
      Starting camera...
    </div>

    <div class="actions">

      <button
        id="capture"
        class="capture"
        onclick="capture()"
        disabled>
        📷 CAPTURE LIVE SELFIE
      </button>

      <button
        id="retake"
        class="retake"
        onclick="startCamera()">
        RETAKE
      </button>

    </div>

    <button
      class="close"
      onclick="goBack()">
      CLOSE CAMERA
    </button>

    <div
      id="msg"
      class="msg">
    </div>

    <canvas id="canvas"></canvas>

  </div>

</div>

<script>

/* =====================================================
   READ URL PARAMETERS
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );

const tm =
  params.get("tm") || "-";

const hq =
  params.get("hq") || "-";

const area =
  params.get("area") || "-";

const exact =
  params.get("exact") ||
  area ||
  "-";

const latitude =
  params.get("lat") || "";

const longitude =
  params.get("lon") || "";

const tmCode =
  params.get("tmCode") || "";

const returnUrl =
  params.get("returnUrl") || "";


/* =====================================================
   DISPLAY DETAILS
===================================================== */

document.getElementById("tm")
  .textContent = tm;

document.getElementById("hq")
  .textContent = hq;

document.getElementById("area")
  .textContent = exact;


/* =====================================================
   CAMERA VARIABLES
===================================================== */

let stream = null;
let busy = false;


/* =====================================================
   STOP CAMERA
===================================================== */

function stopCamera(){

  if(stream){

    stream
      .getTracks()
      .forEach(
        function(track){
          track.stop();
        }
      );

    stream = null;
  }

}


/* =====================================================
   START CAMERA
===================================================== */

async function startCamera(){

  const status =
    document.getElementById("status");

  const msg =
    document.getElementById("msg");

  const captureBtn =
    document.getElementById("capture");

  const retakeBtn =
    document.getElementById("retake");

  msg.textContent = "";
  msg.style.color = "#b3261e";

  captureBtn.disabled = true;
  retakeBtn.style.display = "none";

  stopCamera();

  try{

    /* -----------------------------------------------
       HTTPS CHECK
    ----------------------------------------------- */

    if(!window.isSecureContext){

      throw new Error(
        "This camera requires HTTPS."
      );

    }


    /* -----------------------------------------------
       CAMERA API CHECK
    ----------------------------------------------- */

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        "Camera API is not available in this browser."
      );

    }


    status.textContent =
      "Requesting camera permission...";

    status.style.color =
      "#102b50";


    /* -----------------------------------------------
       CHECK CAMERA PERMISSION
    ----------------------------------------------- */

    if(
      navigator.permissions &&
      navigator.permissions.query
    ){

      try{

        const permission =
          await navigator.permissions.query({
            name:"camera"
          });

        if(permission.state === "denied"){

          status.textContent =
            "Camera permission blocked";

          msg.textContent =
            "Chrome has blocked camera access. Click the camera icon near the address bar and select Allow.";

          msg.style.color =
            "#b3261e";

          throw new Error(
            "Camera permission blocked."
          );

        }

      }catch(permissionError){

        /*
         * Permissions API is not supported
         * in every browser. The actual
         * getUserMedia request below remains
         * the final permission request.
         */

        if(
          permissionError.message &&
          permissionError.message.indexOf(
            "blocked"
          ) !== -1
        ){

          throw permissionError;

        }

      }

    }


    /* -----------------------------------------------
       ACTUAL CAMERA PERMISSION REQUEST
    ----------------------------------------------- */

    status.textContent =
      "Please allow camera access...";

    stream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:{
            ideal:"user"
          },

          width:{
            ideal:1280
          },

          height:{
            ideal:960
          }
        },

        audio:false

      });


    /* -----------------------------------------------
       CONNECT CAMERA
    ----------------------------------------------- */

    const video =
      document.getElementById("video");

    video.srcObject =
      stream;

    await video.play();


    /* -----------------------------------------------
       CAMERA READY
    ----------------------------------------------- */

    status.textContent =
      "✓ Camera ready — capture when ready";

    status.style.color =
      "#08714f";

    captureBtn.disabled =
      false;

  }catch(e){

    console.error(
      "Camera Error:",
      e
    );

    captureBtn.disabled =
      true;

    status.style.color =
      "#b3261e";

    let errorMessage =
      "";

    if(
      e.name === "NotAllowedError"
    ){

      errorMessage =
        "Camera access was denied. Click the camera icon near the address bar → Camera → Allow, then reload this page.";

    }

    else if(
      e.name === "NotFoundError"
    ){

      errorMessage =
        "No camera was found on this device.";

    }

    else if(
      e.name === "NotReadableError"
    ){

      errorMessage =
        "Camera is already being used by another application.";

    }

    else if(
      e.name === "SecurityError"
    ){

      errorMessage =
        "Browser security blocked camera access.";

    }

    else{

      errorMessage =
        e.message ||
        "Please allow camera access.";

    }

    status.textContent =
      "Camera permission required";

    msg.textContent =
      errorMessage;

  }

}


/* =====================================================
   CLOSE CAMERA
===================================================== */

function goBack(){

  stopCamera();

  /*
   * Return to Aurum Sync without
   * trying to submit through fetch.
   */

  if(window.opener){

    try{

      window.opener.focus();

    }catch(e){}

    window.close();

    return;

  }

  if(returnUrl){

    window.location.href =
      returnUrl;

  }else{

    window.history.back();

  }

}


/* =====================================================
   SEND CAPTURE DIRECTLY TO AURUM SYNC
===================================================== */

function sendCaptureToAurum(image){

  if(!window.opener){

    throw new Error(
      "Aurum Sync window is not available. Please reopen LIVE GPS SELFIE from Aurum Sync."
    );

  }

  /*
   * Send image + verification data
   * directly to the parent Aurum page.
   *
   * NO fetch()
   * NO cross-origin POST
   */

  window.opener.postMessage(

    {
      type:
        "AURUM_GPS_SELFIE_CAPTURE",

      image:
        image,

      tmCode:
        tmCode,

      latitude:
        latitude,

      longitude:
        longitude,

      tm:
        tm,

      hq:
        hq,

      area:
        area,

      exactLocation:
        exact

    },

    "*"

  );

}


/* =====================================================
   CAPTURE SELFIE
===================================================== */

function capture(){

  if(
    busy ||
    !stream
  ){

    return;

  }

  busy = true;


  const video =
    document.getElementById("video");

  const canvas =
    document.getElementById("canvas");

  const ctx =
    canvas.getContext("2d");


  if(!video.videoWidth){

    busy = false;

    return;

  }


  /* -----------------------------------------------
     IMAGE SIZE
  ----------------------------------------------- */

  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;


  /* -----------------------------------------------
     MIRROR CORRECTION
  ----------------------------------------------- */

  ctx.save();

  ctx.translate(
    canvas.width,
    0
  );

  ctx.scale(
    -1,
    1
  );

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.restore();


  /* -----------------------------------------------
     COMPACT VERIFICATION STAMP
  ----------------------------------------------- */

  const pad =
    Math.max(
      20,
      Math.round(
        canvas.width * 0.026
      )
    );


  /*
   * Balanced stamp height.
   * Enough space for title,
   * TM, date/time and location.
   */

  const stampHeight =
    Math.max(
      250,
      Math.round(
        canvas.height * 0.27
      )
    );


  const stampY =
    canvas.height -
    stampHeight;


  ctx.save();


  /* -----------------------------------------------
     DARK STAMP BACKGROUND
  ----------------------------------------------- */

  ctx.fillStyle =
    "rgba(0,0,0,0.78)";

  ctx.fillRect(
    0,
    stampY,
    canvas.width,
    stampHeight
  );


  /* -----------------------------------------------
     FONT SIZES
  ----------------------------------------------- */

  const titleSize =
    Math.max(
      25,
      Math.round(
        canvas.width * 0.034
      )
    );


  const textSize =
    Math.max(
      18,
      Math.round(
        canvas.width * 0.023
      )
    );


  const locationSize =
    Math.max(
      16,
      Math.round(
        canvas.width * 0.020
      )
    );


  /* -----------------------------------------------
     TITLE
  ----------------------------------------------- */

  ctx.fillStyle =
    "#ffffff";

  ctx.font =
    "700 " +
    titleSize +
    "px Arial";

  let y =
    stampY +
    40;


  ctx.fillText(
    "AURUM • LIVE GPS VERIFIED",
    pad,
    y
  );


  /* -----------------------------------------------
     TM NAME
  ----------------------------------------------- */

  y += 38;

  ctx.font =
    "600 " +
    textSize +
    "px Arial";

  ctx.fillText(
    "TM: " + tm,
    pad,
    y
  );


  /* -----------------------------------------------
     DATE & TIME
  ----------------------------------------------- */

  const dt =
    new Date().toLocaleString(
      "en-IN",
      {
        day:"2-digit",
        month:"short",
        year:"numeric",
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit"
      }
    );


  y += 34;

  ctx.fillText(
    dt,
    pad,
    y
  );


  /* -----------------------------------------------
     LOCATION
  ----------------------------------------------- */

  y += 40;


  /* -----------------------------------------------
     LOCATION PIN
  ----------------------------------------------- */

  const pinX =
    pad + 10;

  const pinY =
    y - 7;

  const pinRadius =
    Math.max(
      9,
      Math.round(
        canvas.width * 0.012
      )
    );


  /* Outer circle */

  ctx.beginPath();

  ctx.arc(
    pinX,
    pinY,
    pinRadius,
    0,
    Math.PI * 2
  );

  ctx.fillStyle =
    "#ffffff";

  ctx.fill();


  /* Pin point */

  ctx.beginPath();

  ctx.moveTo(
    pinX -
      pinRadius * 0.72,
    pinY +
      pinRadius * 0.45
  );

  ctx.lineTo(
    pinX,
    pinY +
      pinRadius * 1.8
  );

  ctx.lineTo(
    pinX +
      pinRadius * 0.72,
    pinY +
      pinRadius * 0.45
  );

  ctx.closePath();

  ctx.fillStyle =
    "#ffffff";

  ctx.fill();


  /* Inner dot */

  ctx.beginPath();

  ctx.arc(
    pinX,
    pinY,
    pinRadius * 0.35,
    0,
    Math.PI * 2
  );

  ctx.fillStyle =
    "rgba(0,0,0,0.78)";

  ctx.fill();


  /* -----------------------------------------------
     LOCATION LABEL
  ----------------------------------------------- */

  const locationStartX =
    pad + 32;


  ctx.font =
    "700 " +
    locationSize +
    "px Arial";

  ctx.fillStyle =
    "#ffffff";


  ctx.fillText(
    "LOCATION",
    locationStartX,
    y
  );


  /* -----------------------------------------------
     LOCATION TEXT
  ----------------------------------------------- */

  y += 29;


  ctx.font =
    "500 " +
    locationSize +
    "px Arial";


  const maxWidth =
    canvas.width -
    locationStartX -
    pad;


  const locationText =
    exact ||
    area ||
    "Location captured";


  const words =
    locationText.split(/\s+/);


  let line = "";

  const lineHeight =
    Math.max(
      23,
      Math.round(
        canvas.width * 0.027
      )
    );


  /* -----------------------------------------------
     AUTOMATIC LOCATION WRAPPING
  ----------------------------------------------- */

  for(
    const word of words
  ){

    const test =
      line +
      word +
      " ";


    if(
      ctx.measureText(test).width >
        maxWidth &&
      line !== ""
    ){

      ctx.fillText(
        line.trim(),
        locationStartX,
        y
      );

      y +=
        lineHeight;

      line =
        word + " ";

    }else{

      line =
        test;

    }

  }


  /* Last location line */

  if(
    line.trim()
  ){

    ctx.fillText(
      line.trim(),
      locationStartX,
      y
    );

  }


  ctx.restore();


  /* -----------------------------------------------
     CONVERT TO IMAGE
  ----------------------------------------------- */

  const image =
    canvas.toDataURL(
      "image/jpeg",
      0.88
    );


  /* -----------------------------------------------
     STOP LIVE CAMERA
  ----------------------------------------------- */

  stopCamera();


  document.getElementById(
    "capture"
  ).disabled = true;


  document.getElementById(
    "status"
  ).textContent =
    "✓ Selfie captured successfully";


  document.getElementById(
    "status"
  ).style.color =
    "#08714f";


  document.getElementById(
    "msg"
  ).textContent =
    "Sending selfie to Aurum Sync...";


  document.getElementById(
    "msg"
  ).style.color =
    "#08714f";


  /* -----------------------------------------------
     SEND IMAGE TO AURUM SYNC
  ----------------------------------------------- */

  try{

    sendCaptureToAurum(image);


    document.getElementById(
      "msg"
    ).textContent =
      "✓ Selfie sent to Aurum Sync. Closing camera...";


    /*
     * Give the opener enough time to
     * receive the base64 image before
     * closing this camera window.
     */

    setTimeout(
      function(){

        if(window.opener){

          try{
            window.opener.focus();
          }catch(e){}

          window.close();

        }else if(returnUrl){

          window.location.href =
            returnUrl;

        }

      },
      700
    );


  }catch(e){

    console.error(
      "Capture transfer error:",
      e
    );


    document.getElementById(
      "status"
    ).textContent =
      "Transfer failed";


    document.getElementById(
      "msg"
    ).textContent =
      e.message ||
      "Please reopen LIVE GPS SELFIE from Aurum Sync.";


    document.getElementById(
      "msg"
    ).style.color =
      "#b3261e";


    busy = false;

  }

}


/* =====================================================
   STOP CAMERA WHEN PAGE CLOSES
===================================================== */

window.addEventListener(
  "beforeunload",
  function(){

    stopCamera();

  }
);


/* =====================================================
   START CAMERA AUTOMATICALLY
===================================================== */

window.addEventListener(
  "load",
  function(){

    /*
     * Camera permission request starts
     * automatically when this page loads.
     */

    startCamera();

  }
);

</script>

</body>
</html>
