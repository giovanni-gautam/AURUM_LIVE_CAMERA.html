<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aurum • Live GPS Camera</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f3f8fc;
  font-family:Arial,sans-serif;
  color:#102b50;
  display:flex;
  justify-content:center;
  min-height:100vh;
}

.wrap{
  width:min(560px,100%);
  padding:18px;
}

.card{
  background:#fff;
  border:1px solid #dbe4ef;
  border-radius:22px;
  padding:18px;
  box-shadow:0 16px 40px rgba(10,45,80,.12);
}

h1{
  font-size:24px;
  text-align:center;
  margin:4px 0;
}

.sub{
  text-align:center;
  color:#70809a;
  font-size:13px;
  margin:0 0 15px;
}

.info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:12px;
}

.info div{
  background:#f5f8fc;
  border:1px solid #dbe4ef;
  border-radius:12px;
  padding:9px;
}

.info small{
  display:block;
  color:#70809a;
  font-size:9px;
  font-weight:800;
  margin-bottom:4px;
}

.info strong{
  font-size:12px;
  line-height:1.25;
}

.camera{
  position:relative;
  background:#061d30;
  border-radius:18px;
  overflow:hidden;
  aspect-ratio:4/3;
}

video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transform:scaleX(-1);
}

.badge{
  position:absolute;
  left:12px;
  top:12px;
  background:#06111c;
  color:#fff;
  border-radius:18px;
  padding:7px 10px;
  font-size:10px;
  font-weight:800;
}

.dot{
  display:inline-block;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#ef3b35;
  margin-right:5px;
}

.status{
  text-align:center;
  font-size:12px;
  margin:12px 0;
  color:#08714f;
  font-weight:700;
  min-height:16px;
}

.actions{
  display:flex;
  gap:9px;
}

button{
  border:0;
  border-radius:12px;
  padding:13px 10px;
  font-weight:800;
  cursor:pointer;
  flex:1;
  font-size:13px;
}

.capture{
  background:#08714f;
  color:#fff;
}

.capture:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.retake{
  background:#e9f0f7;
  color:#102b50;
  display:none;
}

.close{
  background:#fff;
  border:1px solid #dbe4ef;
  color:#102b50;
  margin-top:9px;
  width:100%;
}

.msg{
  text-align:center;
  color:#b3261e;
  font-size:12px;
  font-weight:700;
  min-height:18px;
  margin-top:8px;
  line-height:1.4;
}

canvas{
  display:none;
}

@media(max-width:430px){
  .info{
    grid-template-columns:1fr;
  }

  .wrap{
    padding:10px;
  }

  .card{
    padding:13px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="card">

    <h1>LIVE GPS SELFIE</h1>

    <p class="sub">
      Aurum • Live camera capture
    </p>


    <div class="info">

      <div>
        <small>TM NAME</small>
        <strong id="tm">-</strong>
      </div>

      <div>
        <small>HQ</small>
        <strong id="hq">-</strong>
      </div>

      <div style="grid-column:1/-1">
        <small>EXACT LOCATION</small>
        <strong id="area">-</strong>
      </div>

    </div>


    <div class="camera">

      <video
        id="video"
        autoplay
        playsinline
        muted>
      </video>

      <div class="badge">
        <span class="dot"></span>
        LIVE CAMERA
      </div>

    </div>


    <div id="status" class="status">
      Starting camera...
    </div>


    <div class="actions">

      <button
        id="capture"
        class="capture"
        onclick="capture()"
        disabled>
        📷 CAPTURE LIVE SELFIE
      </button>

      <button
        id="retake"
        class="retake"
        onclick="startCamera()">
        RETAKE
      </button>

    </div>


    <button
      class="close"
      onclick="goBack()">
      CLOSE CAMERA
    </button>


    <div
      id="msg"
      class="msg">
    </div>


    <canvas id="canvas"></canvas>

  </div>

</div>


<script>

/* =====================================================
   READ URL PARAMETERS
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


const tm =
  params.get("tm") || "-";


const hq =
  params.get("hq") || "-";


const area =
  params.get("area") || "-";


const exact =
  params.get("exact") ||
  area ||
  "-";


const latitude =
  params.get("lat") || "";


const longitude =
  params.get("lon") || "";


const tmCode =
  params.get("tmCode") || "";


const returnUrl =
  params.get("returnUrl") || "";


/* =====================================================
   DISPLAY DETAILS
===================================================== */

document.getElementById("tm")
  .textContent = tm;


document.getElementById("hq")
  .textContent = hq;


document.getElementById("area")
  .textContent = exact;


/* =====================================================
   CAMERA VARIABLES
===================================================== */

let stream = null;

let busy = false;


/* =====================================================
   STOP CAMERA
===================================================== */

function stopCamera(){

  if(stream){

    stream
      .getTracks()
      .forEach(
        function(track){
          track.stop();
        }
      );

    stream = null;
  }

}


/* =====================================================
   START CAMERA
===================================================== */

async function startCamera(){

  const status =
    document.getElementById("status");

  const msg =
    document.getElementById("msg");

  const captureBtn =
    document.getElementById("capture");

  const retakeBtn =
    document.getElementById("retake");


  msg.textContent = "";

  msg.style.color = "#b3261e";

  captureBtn.disabled = true;

  retakeBtn.style.display = "none";


  stopCamera();


  try{

    /* -----------------------------------------------
       SECURE CONNECTION CHECK
    ----------------------------------------------- */

    if(
      !window.isSecureContext
    ){

      throw new Error(
        "This camera requires HTTPS."
      );

    }


    /* -----------------------------------------------
       CAMERA API CHECK
    ----------------------------------------------- */

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        "Camera API is not available in this browser."
      );

    }


    status.textContent =
      "Requesting camera permission...";


    /* -----------------------------------------------
       CAMERA PERMISSION STATE
    ----------------------------------------------- */

    try{

      if(
        navigator.permissions &&
        navigator.permissions.query
      ){

        const permission =
          await navigator.permissions.query({
            name:"camera"
          });


        if(
          permission.state === "denied"
        ){

          throw new Error(
            "Camera permission is BLOCKED for this site. Open Chrome Site Settings → Camera → Allow."
          );

        }

      }

    }catch(permissionError){

      /*
       * Ignore unsupported Permissions API.
       * Actual getUserMedia call below remains
       * the final authority.
       */

      if(
        permissionError.message &&
        permissionError.message.indexOf(
          "BLOCKED"
        ) !== -1
      ){

        throw permissionError;

      }

    }


    /* -----------------------------------------------
       REQUEST CAMERA
    ----------------------------------------------- */

    stream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:"user",
          width:{
            ideal:1280
          },
          height:{
            ideal:960
          }
        },

        audio:false

      });


    /* -----------------------------------------------
       CONNECT STREAM TO VIDEO
    ----------------------------------------------- */

    const video =
      document.getElementById("video");


    video.srcObject =
      stream;


    await video.play();


    /* -----------------------------------------------
       CAMERA READY
    ----------------------------------------------- */

    status.textContent =
      "✓ Camera ready — capture when ready";


    status.style.color =
      "#08714f";


    captureBtn.disabled =
      false;


  }catch(e){

    console.error(
      "Camera Error:",
      e
    );


    status.textContent =
      "Camera permission required";


    status.style.color =
      "#b3261e";


    let errorMessage =
      "";


    /* -----------------------------------------------
       EXACT ERROR
    ----------------------------------------------- */

    if(
      e.name === "NotAllowedError"
    ){

      errorMessage =
        "Camera access was denied. Chrome Site Settings → Camera → Allow for giovanni-gautam.github.io, then refresh.";

    }

    else if(
      e.name === "NotFoundError"
    ){

      errorMessage =
        "No camera was found on this device.";

    }

    else if(
      e.name === "NotReadableError"
    ){

      errorMessage =
        "Camera is already being used by another application.";

    }

    else if(
      e.name === "SecurityError"
    ){

      errorMessage =
        "Browser security blocked camera access.";

    }

    else{

      errorMessage =
        e.message ||
        "Please allow camera access.";

    }


    msg.textContent =
      errorMessage;


    captureBtn.disabled =
      true;

  }

}


/* =====================================================
   CLOSE CAMERA
===================================================== */

function goBack(){

  stopCamera();


  if(returnUrl){

    window.location.href =
      returnUrl;

  }else{

    window.history.back();

  }

}


/* =====================================================
   SUBMIT CAPTURE
===================================================== */

async function submitCapture(image){

  const status =
    document.getElementById("status");

  const msg =
    document.getElementById("msg");


  if(
    !returnUrl ||
    !tmCode ||
    !latitude ||
    !longitude
  ){

    status.textContent =
      "Selfie captured";


    msg.textContent =
      "Return information is missing. Please reopen LIVE GPS SELFIE from Aurum Sync.";


    busy = false;

    return;

  }


  status.textContent =
    "Submitting LIVE GPS SELFIE...";


  msg.textContent =
    "Please wait...";


  msg.style.color =
    "#08714f";


  try{

    const body =
      new URLSearchParams();


    body.append(
      "tmCode",
      tmCode
    );


    body.append(
      "latitude",
      latitude
    );


    body.append(
      "longitude",
      longitude
    );


    body.append(
      "image",
      image
    );


    body.append(
      "area",
      area
    );


    body.append(
      "exactLocation",
      exact
    );


    await fetch(
      returnUrl,
      {
        method:"POST",
        mode:"no-cors",
        body:body,
        keepalive:true
      }
    );


    status.textContent =
      "✓ Selfie submitted successfully";


    msg.textContent =
      "Returning to Aurum Sync...";


    stopCamera();


    setTimeout(
      function(){

        const backUrl =
          returnUrl +
          (
            returnUrl.indexOf("?") === -1
              ? "?"
              : "&"
          ) +
          "gpsDone=1";


        window.location.href =
          backUrl;

      },
      900
    );


  }catch(e){

    console.error(
      "Submission error:",
      e
    );


    status.textContent =
      "Submission failed";


    msg.textContent =
      "Please try again. " +
      (e.message || "");


    msg.style.color =
      "#b3261e";


    busy = false;

  }

}


/* =====================================================
   CAPTURE SELFIE
===================================================== */

function capture(){

  if(
    busy ||
    !stream
  ){

    return;

  }


  busy = true;


  const video =
    document.getElementById(
      "video"
    );


  const canvas =
    document.getElementById(
      "canvas"
    );


  const ctx =
    canvas.getContext(
      "2d"
    );


  if(
    !video.videoWidth
  ){

    busy = false;

    return;

  }


  canvas.width =
    video.videoWidth;


  canvas.height =
    video.videoHeight;


  /* -----------------------------------------------
     MIRROR CORRECTION
  ----------------------------------------------- */

  ctx.save();


  ctx.translate(
    canvas.width,
    0
  );


  ctx.scale(
    -1,
    1
  );


  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.restore();


  /* -----------------------------------------------
     VERIFICATION STAMP
  ----------------------------------------------- */

  const stampHeight =
    Math.max(
      170,
      Math.round(
        canvas.height * 0.22
      )
    );


  const stampY =
    canvas.height -
    stampHeight;


  ctx.save();


  ctx.fillStyle =
    "rgba(0,0,0,0.76)";


  ctx.fillRect(
    0,
    stampY,
    canvas.width,
    stampHeight
  );


  const pad =
    Math.max(
      18,
      Math.round(
        canvas.width * 0.025
      )
    );


  const titleSize =
    Math.max(
      24,
      Math.round(
        canvas.width * 0.035
      )
    );


  const textSize =
    Math.max(
      18,
      Math.round(
        canvas.width * 0.023
      )
    );


  ctx.fillStyle =
    "#ffffff";


  ctx.font =
    "700 " +
    titleSize +
    "px Arial";


  ctx.fillText(
    "AURUM • LIVE GPS VERIFIED",
    pad,
    stampY +
    titleSize +
    10
  );


  ctx.font =
    "600 " +
    textSize +
    "px Arial";


  ctx.fillText(
    "TM: " + tm,
    pad,
    stampY +
    titleSize +
    textSize +
    25
  );


  ctx.fillText(
    "HQ: " + hq,
    pad,
    stampY +
    titleSize +
    (textSize * 2) +
    40
  );


  ctx.font =
    "600 " +
    Math.max(
      16,
      Math.round(
        canvas.width * 0.020
      )
    ) +
    "px Arial";


  const maxWidth =
    canvas.width -
    (pad * 2);


  let line =
    "LOCATION: ";


  let y =
    stampY +
    titleSize +
    (textSize * 3) +
    55;


  const words =
    (
      exact ||
      area ||
      "Location captured"
    ).split(" ");


  for(
    const word of words
  ){

    const test =
      line +
      word +
      " ";


    if(
      ctx.measureText(
        test
      ).width >
      maxWidth &&
      line !== "LOCATION: "
    ){

      ctx.fillText(
        line.trim(),
        pad,
        y
      );


      y +=
        Math.max(
          22,
          Math.round(
            canvas.width * 0.026
          )
        );


      line =
        "    " +
        word +
        " ";

    }else{

      line =
        test;

    }

  }


  ctx.fillText(
    line.trim(),
    pad,
    y
  );


  ctx.font =
    "500 " +
    Math.max(
      15,
      Math.round(
        canvas.width * 0.018
      )
    ) +
    "px Arial";


  const dt =
    new Date().toLocaleString(
      "en-IN",
      {
        day:"2-digit",
        month:"short",
        year:"numeric",
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit"
      }
    );


  ctx.fillText(
    dt,
    pad,
    stampY +
    stampHeight -
    12
  );


  ctx.restore();


  /* -----------------------------------------------
     CONVERT IMAGE
  ----------------------------------------------- */

  const image =
    canvas.toDataURL(
      "image/jpeg",
      0.88
    );


  document.getElementById(
    "capture"
  ).disabled = true;


  submitCapture(
    image
  );

}


/* =====================================================
   STOP CAMERA WHEN PAGE CLOSES
===================================================== */

window.addEventListener(
  "beforeunload",
  function(){

    stopCamera();

  }
);


/* =====================================================
   START CAMERA AUTOMATICALLY
===================================================== */

window.addEventListener(
  "load",
  function(){

    startCamera();

  }
);

</script>

</body>
</html>
