<!-- AURUM LIVE GPS CAMERA FINAL FIXED - 2026-09-18 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aurum • Live GPS Camera</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f3f8fc;
  font-family:Arial,sans-serif;
  color:#102b50;
  display:flex;
  justify-content:center;
  min-height:100vh;
}

.wrap{
  width:min(560px,100%);
  padding:18px;
}

.card{
  background:#fff;
  border:1px solid #dbe4ef;
  border-radius:22px;
  padding:18px;
  box-shadow:0 16px 40px rgba(10,45,80,.12);
}

h1{
  font-size:24px;
  text-align:center;
  margin:4px 0;
}

.sub{
  text-align:center;
  color:#70809a;
  font-size:13px;
  margin:0 0 15px;
}

.info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:12px;
}

.info div{
  background:#f5f8fc;
  border:1px solid #dbe4ef;
  border-radius:12px;
  padding:9px;
}

.info small{
  display:block;
  color:#70809a;
  font-size:9px;
  font-weight:800;
  margin-bottom:4px;
}

.info strong{
  font-size:12px;
  line-height:1.25;
}

.camera{
  position:relative;
  background:#061d30;
  border-radius:18px;
  overflow:hidden;
  aspect-ratio:4/3;
}

video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transform:scaleX(-1);
}

.badge{
  position:absolute;
  left:12px;
  top:12px;
  background:#06111c;
  color:#fff;
  border-radius:18px;
  padding:7px 10px;
  font-size:10px;
  font-weight:800;
}

.dot{
  display:inline-block;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#ef3b35;
  margin-right:5px;
}

.status{
  text-align:center;
  font-size:12px;
  margin:12px 0;
  color:#08714f;
  font-weight:700;
  min-height:16px;
}

.actions{
  display:flex;
  gap:9px;
}

button{
  border:0;
  border-radius:12px;
  padding:13px 10px;
  font-weight:800;
  cursor:pointer;
  flex:1;
  font-size:13px;
}

.capture{
  background:#08714f;
  color:#fff;
}

.capture:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.retake{
  background:#e9f0f7;
  color:#102b50;
  display:none;
}

.close{
  background:#fff;
  border:1px solid #dbe4ef;
  color:#102b50;
  margin-top:9px;
  width:100%;
}

.msg{
  text-align:center;
  color:#b3261e;
  font-size:12px;
  font-weight:700;
  min-height:18px;
  margin-top:8px;
  line-height:1.4;
}

canvas{
  display:none;
}

@media(max-width:430px){
  .info{
    grid-template-columns:1fr;
  }

  .wrap{
    padding:10px;
  }

  .card{
    padding:13px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="card">

    <h1>LIVE GPS SELFIE</h1>

    <p class="sub">
      Aurum • Live camera capture
    </p>


    <div class="info">

      <div>
        <small>TM NAME</small>
        <strong id="tm">-</strong>
      </div>

      <div>
        <small>HQ</small>
        <strong id="hq">-</strong>
      </div>

      <div>
        <small>AREA / LOCATION</small>
        <strong id="area">-</strong>
      </div>

      <div>
        <small>EXACT LOCATION</small>
        <strong id="exact">-</strong>
      </div>

    </div>


    <div class="camera">

      <video
        id="video"
        autoplay
        playsinline
        muted>
      </video>

      <div class="badge">
        <span class="dot"></span>
        LIVE CAMERA
      </div>

    </div>


    <div id="status" class="status">
      Starting camera...
    </div>


    <div class="actions">

      <button
        id="capture"
        class="capture"
        onclick="capture()"
        disabled>
        📷 CAPTURE LIVE SELFIE
      </button>

      <button
        id="retake"
        class="retake"
        onclick="startCamera()">
        RETAKE
      </button>

    </div>


    <button
      class="close"
      onclick="goBack()">
      CLOSE CAMERA
    </button>


    <div
      id="msg"
      class="msg">
    </div>


    <canvas id="canvas"></canvas>

  </div>

</div>


<script>
const params =
  new URLSearchParams(location.search);

const tm =
  params.get("tm") || "-";

const hq =
  params.get("hq") || "-";

const tmCode =
  params.get("tmCode") || "";

const returnUrl =
  params.get("returnUrl") || "";

/* Location values are supplied by Aurum Sync after server-side reverse geocoding. */
let areaLocation = params.get("area") || "";
let exactLocation = params.get("exact") || "";

let latitude = Number(params.get("lat"));
let longitude = Number(params.get("lon"));
let gpsAccuracy = Number(params.get("accuracy"));

if(!Number.isFinite(latitude)) latitude = null;
if(!Number.isFinite(longitude)) longitude = null;
if(!Number.isFinite(gpsAccuracy)) gpsAccuracy = null;

let stream = null;
let busy = false;
let locationReady = false;
let exactLocationReady = false;


/* =====================================================
   DISPLAY TM DETAILS
===================================================== */

document.getElementById("tm")
  .textContent = tm;

document.getElementById("hq")
  .textContent = hq;

document.getElementById("area")
  .textContent = areaLocation || "Location not available";

document.getElementById("exact")
  .textContent = exactLocation || "Location not available";

if(gpsAccuracy !== null){
  document.getElementById("status").textContent =
    "GPS accuracy • ±" +
    Math.round(gpsAccuracy) +
    " m";
}


/* =====================================================
   STOP CAMERA
===================================================== */

function stopCamera(){

  if(stream){

    stream
      .getTracks()
      .forEach(function(track){
        track.stop();
      });

    stream = null;
  }
}


/* =====================================================
   UPDATE CAPTURE BUTTON
===================================================== */

function updateCaptureAvailability(){

  const captureBtn =
    document.getElementById("capture");

  captureBtn.disabled =
    !(
      stream &&
      locationReady &&
      exactLocationReady
    );
}


/* =====================================================
   GET EXACT LOCATION FROM APPS SCRIPT
   JSONP avoids cross-origin fetch/CORS issues.
===================================================== */

function resolveExactAddress(){

  if(
    !returnUrl ||
    latitude === null ||
    longitude === null
  ){
    return;
  }

  const callbackName =
    "__aurumGPSAddress_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .slice(2);

  let script = null;
  let finished = false;

  function cleanup(){

    try{
      delete window[callbackName];
    }catch(error){}

    if(
      script &&
      script.parentNode
    ){
      script.parentNode.removeChild(script);
    }
  }

  function finish(data){

    if(finished){
      return;
    }

    finished = true;
    cleanup();

    data =
      data || {};

    const exact =
      String(
        data.exactLocation || ""
      ).trim();

    const area =
      String(
        data.areaLocation || ""
      ).trim();

    const bad = [
      "",
      "Location captured",
      "Location not available",
      "Invalid GPS location",
      "Address not found"
    ];

    if(
      bad.indexOf(exact) === -1
    ){

      exactLocation =
        exact;

      areaLocation =
        area || exact;

      exactLocationReady =
        true;

      document.getElementById("area")
        .textContent =
        areaLocation;

      document.getElementById("exact")
        .textContent =
        exactLocation;

      document.getElementById("status")
        .textContent =
        "✓ Camera + Exact GPS ready" +
        (
          gpsAccuracy !== null
            ? " • ±" +
              Math.round(
                gpsAccuracy
              ) +
              " m"
            : ""
        ) +
        " — capture when ready";

      document.getElementById("status")
        .style.color =
        "#08714f";

      document.getElementById("msg")
        .textContent =
        "Exact GPS address verified.";

      document.getElementById("msg")
        .style.color =
        "#08714f";

    }else{

      exactLocationReady =
        false;

      document.getElementById("area")
        .textContent =
        area || "Address unavailable";

      document.getElementById("exact")
        .textContent =
        "Waiting for exact address...";

      document.getElementById("status")
        .textContent =
        "GPS received • Waiting for exact address...";

      document.getElementById("status")
        .style.color =
        "#b3261e";

      document.getElementById("msg")
        .textContent =
        "GPS is available. Waiting for the address service.";

      document.getElementById("msg")
        .style.color =
        "#b3261e";
    }

    updateCaptureAvailability();
  }

  window[callbackName] =
    finish;

  try{

    const apiUrl =
      new URL(
        returnUrl
      );

    apiUrl.search = "";
    apiUrl.hash = "";

    apiUrl.searchParams.set(
      "api",
      "getGPSLocationDetails"
    );

    apiUrl.searchParams.set(
      "arg0",
      String(latitude)
    );

    apiUrl.searchParams.set(
      "arg1",
      String(longitude)
    );

    apiUrl.searchParams.set(
      "callback",
      callbackName
    );

    apiUrl.searchParams.set(
      "_",
      String(Date.now())
    );

    script =
      document.createElement(
        "script"
      );

    script.src =
      apiUrl.toString();

    script.async =
      true;

    script.onerror =
      function(){
        finish({});
      };

    document.head.appendChild(
      script
    );

    setTimeout(
      function(){

        if(!finished){
          finish({});
        }

      },
      10000
    );

  }catch(error){

    console.error(
      "Exact address request failed:",
      error
    );

    finish({});
  }
}


/* =====================================================
   PROCESS BEST GPS POSITION
===================================================== */

function processGPSPosition(
  position
){

  if(
    !position ||
    !position.coords
  ){
    return;
  }

  const lat =
    Number(
      position.coords.latitude
    );

  const lon =
    Number(
      position.coords.longitude
    );

  const accuracy =
    Number(
      position.coords.accuracy
    );

  if(
    !Number.isFinite(lat) ||
    !Number.isFinite(lon)
  ){
    return;
  }

  /*
   * Keep the first usable location immediately.
   * After that, only replace it when the device reports
   * a materially better accuracy.
   */
  if(
    Number.isFinite(
      lastGPSAccuracy
    ) &&
    Number.isFinite(
      accuracy
    ) &&
    accuracy >=
      lastGPSAccuracy - 2
  ){
    return;
  }

  latitude =
    lat;

  longitude =
    lon;

  gpsAccuracy =
    Number.isFinite(
      accuracy
    )
      ? accuracy
      : null;

  lastGPSAccuracy =
    gpsAccuracy;

  locationReady =
    true;

  document.getElementById("area")
    .textContent =
    "Resolving exact address...";

  document.getElementById("exact")
    .textContent =
    "Waiting for exact address...";

  document.getElementById("status")
    .textContent =
    "✓ GPS received • Resolving exact address...";

  document.getElementById("status")
    .style.color =
    "#08714f";

  document.getElementById("msg")
    .textContent =
    "GPS accuracy • ±" +
    (
      gpsAccuracy !== null
        ? Math.round(
            gpsAccuracy
          )
        : "?"
    ) +
    " m";

  document.getElementById("msg")
    .style.color =
    "#08714f";

  resolveExactAddress();

  updateCaptureAvailability();
}


/* =====================================================
   REQUEST LIVE LOCATION
===================================================== */

let lastGPSAccuracy = null;

function startLiveLocation(){

  if(
    !navigator.geolocation
  ){

    document.getElementById("status")
      .textContent =
      "Location permission required";

    document.getElementById("status")
      .style.color =
      "#b3261e";

    document.getElementById("msg")
      .textContent =
      "GPS is not supported on this device.";

    updateCaptureAvailability();

    return;
  }


  document.getElementById("status")
    .textContent =
    "Acquiring GPS location...";

  document.getElementById("status")
    .style.color =
    "#08714f";

  document.getElementById("msg")
    .textContent =
    "Location is being acquired. Camera is already active.";

  document.getElementById("msg")
    .style.color =
    "#08714f";


  /*
   * FAST FIRST FIX
   * Uses network-assisted location so the page does not sit
   * waiting for a cold high-accuracy GPS lock.
   */
  navigator.geolocation.getCurrentPosition(

    function(position){
      processGPSPosition(
        position
      );
    },

    function(error){
      console.warn(
        "Fast GPS failed:",
        error
      );
    },

    {
      enableHighAccuracy:false,
      timeout:5000,
      maximumAge:30000
    }
  );


  /*
   * HIGH-ACCURACY WATCH
   * The phone can improve the location in the background.
   */
  try{

    gpsWatchId =
      navigator.geolocation.watchPosition(

        function(position){

          processGPSPosition(
            position
          );

        },

        function(error){

          console.warn(
            "High accuracy GPS error:",
            error
          );

          if(
            latitude === null
          ){

            document.getElementById("status")
              .textContent =
              (
                error &&
                error.code === 1
              )
                ? "Location permission required"
                : "Waiting for GPS...";

            document.getElementById("status")
              .style.color =
              "#b3261e";

            document.getElementById("msg")
              .textContent =
              (
                error &&
                error.code === 1
              )
                ? "Chrome Site Settings → Location → Allow for giovanni-gautam.github.io, then refresh."
                : "Keep Location enabled and wait for the GPS fix.";

            updateCaptureAvailability();
          }
        },

        {
          enableHighAccuracy:true,
          timeout:10000,
          maximumAge:0
        }
      );


    /*
     * Keep the high-accuracy watch alive for 25 seconds,
     * enough time for the phone to improve a cold GPS fix.
     */
    gpsStopTimer =
      setTimeout(
        function(){

          if(
            gpsWatchId !== null
          ){

            try{
              navigator.geolocation
                .clearWatch(
                  gpsWatchId
                );
            }catch(error){}

            gpsWatchId =
              null;
          }

        },
        25000
      );

  }catch(error){

    console.warn(
      "GPS watch could not start:",
      error
    );
  }

}


/* =====================================================
   REQUEST CAMERA
===================================================== */

async function startCamera(){

  const status =
    document.getElementById("status");

  const msg =
    document.getElementById("msg");

  const captureBtn =
    document.getElementById("capture");

  const retakeBtn =
    document.getElementById("retake");

  captureBtn.disabled = true;

  retakeBtn.style.display = "none";

  stopCamera();

  try{

    if(!window.isSecureContext){
      throw new Error(
        "Camera requires a secure HTTPS page."
      );
    }

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){
      throw new Error(
        "Camera API is not available in this browser."
      );
    }

    status.textContent =
      "Requesting Camera permission...";

    status.style.color =
      "#08714f";

    const newStream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:{
            ideal:"user"
          },
          width:{
            ideal:1280
          },
          height:{
            ideal:960
          }
        },

        audio:false
      });

    stream = newStream;

    const video =
      document.getElementById("video");

    video.srcObject =
      stream;

    await video.play();

    status.textContent =
      exactLocationReady
        ? "✓ Camera + Exact GPS ready" +
          (
            gpsAccuracy !== null
              ? " • ±" +
                Math.round(gpsAccuracy) +
                " m"
              : ""
          ) +
          " — capture when ready"
        : "✓ Camera ready • Verifying exact location...";

    status.style.color =
      "#08714f";

    msg.textContent =
      exactLocationReady
        ? ""
        : "Please wait for exact location verification.";

    updateCaptureAvailability();

  }catch(error){

    console.error(
      "Camera Error:",
      error
    );

    status.textContent =
      "Camera permission required";

    status.style.color =
      "#b3261e";

    if(
      error &&
      error.name === "NotAllowedError"
    ){

      msg.textContent =
        "Camera access was denied. Chrome Site Settings → Camera → Allow for giovanni-gautam.github.io, then refresh.";

    }else if(
      error &&
      error.name === "NotFoundError"
    ){

      msg.textContent =
        "No camera was found on this device.";

    }else if(
      error &&
      error.name === "NotReadableError"
    ){

      msg.textContent =
        "Camera is already being used by another application.";

    }else{

      msg.textContent =
        error.message ||
        "Please allow camera access.";
    }

    updateCaptureAvailability();
  }
}


/* =====================================================
   CAPTURE
===================================================== */

function capture(){

  if(
    busy ||
    !stream ||
    !locationReady ||
    !exactLocationReady ||
    !exactLocation ||
    exactLocation === "Location captured" ||
    exactLocation === "Location not available"
  ){
    return;
  }

  busy = true;

  const video =
    document.getElementById("video");

  const canvas =
    document.getElementById("canvas");

  const ctx =
    canvas.getContext("2d");

  if(!video.videoWidth){

    busy = false;
    return;
  }

  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;

  /*
   * Mirror correction for selfie preview.
   */
  ctx.save();

  ctx.translate(
    canvas.width,
    0
  );

  ctx.scale(
    -1,
    1
  );

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.restore();


  /*
   * ===================================================
   * VERIFIED GPS STAMP
   * ===================================================
   */
  const pad =
    Math.max(
      24,
      Math.round(
        canvas.width * 0.026
      )
    );

  const titleSize =
    Math.max(
      22,
      Math.round(
        canvas.width * 0.032
      )
    );

  const bodySize =
    Math.max(
      17,
      Math.round(
        canvas.width * 0.021
      )
    );

  const smallSize =
    Math.max(
      15,
      Math.round(
        canvas.width * 0.018
      )
    );

  const maxTextWidth =
    canvas.width -
    (pad * 2);

  /*
   * Split long strings into wrapped lines.
   */
  function wrapText(
    text,
    font,
    maxWidth
  ){

    ctx.font = font;

    const words =
      String(text || "")
        .split(/\s+/)
        .filter(Boolean);

    const lines = [];
    let line = "";

    words.forEach(function(word){

      const test =
        line
          ? line + " " + word
          : word;

      if(
        ctx.measureText(test).width >
        maxWidth &&
        line
      ){

        lines.push(line);
        line = word;

      }else{

        line = test;
      }

    });

    if(line){
      lines.push(line);
    }

    return lines.length
      ? lines
      : [""];
  }

  const exactText =
    String(
      exactLocation || ""
    ).trim();

  const locationLines =
    wrapText(
      exactText,
      "700 " +
      bodySize +
      "px Arial",
      maxTextWidth
    );

  const gpsText =
    "GPS: " +
    Number(latitude).toFixed(6) +
    ", " +
    Number(longitude).toFixed(6) +
    (
      gpsAccuracy !== null
        ? " • Accuracy ±" +
          Math.round(gpsAccuracy) +
          " m"
        : ""
    );

  const dateText =
    new Date().toLocaleString(
      "en-IN",
      {
        day:"2-digit",
        month:"short",
        year:"numeric",
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit"
      }
    );

  const lineHeight =
    Math.max(
      24,
      Math.round(
        canvas.width * 0.027
      )
    );

  const stampHeight =
    Math.max(
      190,
      (
        34 +
        titleSize +
        14 +
        bodySize +
        12 +
        smallSize +
        16 +
        locationLines.length *
          lineHeight +
        12 +
        smallSize +
        20
      )
    );

  const stampY =
    canvas.height -
    stampHeight;

  ctx.save();

  ctx.fillStyle =
    "rgba(0,0,0,0.80)";

  ctx.fillRect(
    0,
    stampY,
    canvas.width,
    stampHeight
  );

  let y =
    stampY +
    34;

  ctx.fillStyle =
    "#ffffff";

  ctx.font =
    "800 " +
    titleSize +
    "px Arial";

  ctx.fillText(
    "AURUM • LIVE GPS VERIFIED",
    pad,
    y
  );

  y +=
    titleSize +
    13;

  ctx.font =
    "700 " +
    bodySize +
    "px Arial";

  ctx.fillText(
    "TM: " +
    tm,
    pad,
    y
  );

  y +=
    bodySize +
    10;

  ctx.font =
    "600 " +
    smallSize +
    "px Arial";

  ctx.fillText(
    "DATE / TIME: " +
    dateText,
    pad,
    y
  );

  y +=
    smallSize +
    14;

  ctx.font =
    "700 " +
    bodySize +
    "px Arial";

  ctx.fillText(
    "📍 EXACT LOCATION:",
    pad,
    y
  );

  y +=
    bodySize +
    8;

  ctx.font =
    "700 " +
    bodySize +
    "px Arial";

  locationLines.forEach(
    function(line){

      ctx.fillText(
        line,
        pad,
        y
      );

      y +=
        lineHeight;
    }
  );

  ctx.font =
    "600 " +
    smallSize +
    "px Arial";

  ctx.fillText(
    gpsText,
    pad,
    y + 2
  );

  ctx.restore();


  const image =
    canvas.toDataURL(
      "image/jpeg",
      0.92
    );

  document.getElementById("capture")
    .disabled = true;

  submitCapture(image);
}


/* =====================================================
   SUBMIT FROM SAME-TAB CAMERA
   Uses normal HTML form POST — no CORS/fetch.
===================================================== */

function submitCapture(
  image
){

  const status =
    document.getElementById(
      "status"
    );

  const msg =
    document.getElementById(
      "msg"
    );


  if(
    !returnUrl ||
    !tmCode ||
    latitude === null ||
    longitude === null ||
    !image ||
    !isRealLocation(
      exactLocation
    )
  ){

    status.textContent =
      "Submission data missing";

    status.style.color =
      "#b3261e";

    msg.textContent =
      "GPS and exact address are required. Please wait for GPS verification.";

    msg.style.color =
      "#b3261e";

    busy =
      false;

    updateCaptureAvailability();

    return;
  }


  status.textContent =
    "✓ Selfie captured • Saving...";

  status.style.color =
    "#08714f";

  msg.textContent =
    "Saving stamped selfie to Aurum Sync...";

  msg.style.color =
    "#08714f";


  /*
   * Hidden iframe POST.
   * The CAMERA PAGE NEVER navigates to Apps Script.
   * This removes the blank-page problem.
   */
  const frameName =
    "AurumGPSSubmit_" +
    Date.now();

  const iframe =
    document.createElement(
      "iframe"
    );

  iframe.name =
    frameName;

  iframe.style.display =
    "none";

  document.body.appendChild(
    iframe
  );


  const form =
    document.createElement(
      "form"
    );

  form.method =
    "POST";

  form.action =
    returnUrl;

  form.target =
    frameName;

  form.style.display =
    "none";


  function addField(
    name,
    value
  ){

    const input =
      document.createElement(
        "input"
      );

    input.type =
      "hidden";

    input.name =
      name;

    input.value =
      String(
        value == null
          ? ""
          : value
      );

    form.appendChild(
      input
    );
  }


  addField(
    "tmCode",
    tmCode
  );

  addField(
    "latitude",
    latitude
  );

  addField(
    "longitude",
    longitude
  );

  addField(
    "image",
    image
  );

  addField(
    "area",
    areaLocation
  );

  addField(
    "exactLocation",
    exactLocation
  );

  /*
   * IMPORTANT:
   * Tells Code.gs doPost NOT to redirect this iframe.
   */
  addField(
    "embedded",
    "1"
  );


  document.body.appendChild(
    form
  );


  let responseLoaded =
    false;

  let completed =
    false;


  function finishSave(){

    if(completed){
      return;
    }

    completed =
      true;


    status.textContent =
      "✓ LIVE GPS SELFIE SAVED";

    status.style.color =
      "#08714f";

    msg.textContent =
      "Selfie saved successfully. Returning to Aurum Sync...";

    msg.style.color =
      "#08714f";


    /*
     * Tell parent, when opener is available.
     */
    try{

      if(
        window.opener &&
        !window.opener.closed
      ){

        window.opener.postMessage(
          {
            type:
              "AURUM_GPS_SELFIE_SAVED",

            success:
              true,

            message:
              "LIVE GPS SELFIE saved successfully.",

            area:
              areaLocation,

            exactLocation:
              exactLocation,

            latitude:
              latitude,

            longitude:
              longitude,

            accuracy:
              gpsAccuracy

          },
          "*"
        );
      }

    }catch(error){}


    stopCamera();


    setTimeout(
      function(){

        try{
          form.remove();
        }catch(error){}

        try{
          iframe.remove();
        }catch(error){}

        try{
          window.close();
        }catch(error){}

      },
      500
    );
  }


  iframe.onload =
    function(){

      /*
       * First load can be the iframe's initial document.
       * Second load is the Apps Script response.
       */
      if(!responseLoaded){

        responseLoaded =
          true;

        return;
      }


      /*
       * Apps Script doPost returned successfully.
       */
      finishSave();
    };


  iframe.onerror =
    function(){

      if(completed){
        return;
      }

      completed =
        true;

      busy =
        false;

      status.textContent =
        "Submission failed";

      status.style.color =
        "#b3261e";

      msg.textContent =
        "The selfie could not be submitted. Please try again.";

      msg.style.color =
        "#b3261e";

      updateCaptureAvailability();

    };


  form.submit();


  /*
   * Safety fallback:
   * if the server response load event is suppressed by the browser,
   * allow the submission a few seconds before completing locally.
   */
  setTimeout(
    function(){

      if(
        !completed
      ){

        finishSave();

      }

    },
    7000
  );

}


/* =====================================================
   RETAKE
=====================================================
*/

document.getElementById("retake")
  .addEventListener(
    "click",
    function(){

      busy = false;
      startCamera();

    }
  );


/* =====================================================
   CLOSE / BACK
===================================================== */

function goBack(){

  stopCamera();

  if(gpsWatchId !== null){

    try{
      navigator.geolocation.clearWatch(gpsWatchId);
    }catch(error){}

    gpsWatchId = null;
  }

  if(gpsStopTimer !== null){

    clearTimeout(gpsStopTimer);
    gpsStopTimer = null;
  }

  if(returnUrl){
    window.location.href =
      returnUrl;
  }else{
    window.history.back();
  }
}


/* =====================================================
   START AUTOMATICALLY
===================================================== */

window.addEventListener(
  "load",
  function(){

    /*
      Location permission first.
      Then camera permission.
      User only presses CAPTURE after both
      permissions have been granted.
    */
    startLiveLocation();

  }
);


/* =====================================================
   STOP CAMERA ON EXIT
===================================================== */

window.addEventListener(
  "beforeunload",
  function(){
    stopCamera();
  }
);

</script>
